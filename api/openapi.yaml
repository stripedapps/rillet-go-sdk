    CustomerRequest:
      example:
        address: ""
        tax_ids: ""
        billing_addresses: ""
        shipping_addresses: ""
        payment_terms: 0
        send_invoices_automatically: false
        emails:
        - id: 0193a6f2-4c1e-7b8a-9d3f-2e5c8a1b7f40
          type: MAIN_SENDER
          email: bobjohnson@somedomain.com
        - id: 0193a6f2-4c1e-7b8a-9d3f-2e5c8a1b7f40
          type: MAIN_SENDER
          email: bobjohnson@somedomain.com
        name_on_invoice: Bob Johnson
        allow_online_payments: true
        name: Bob
        send_payment_reminders: false
        shipping_address: ""
        fields: ""
        external_references:
        - id: "234"
          type: xyzSystemId
          url: https://xyzsystempage.com/ids/234
        - id: "234"
          type: xyzSystemId
          url: https://xyzsystempage.com/ids/234
      properties:
        name:
          example: Bob
          type: string
        name_on_invoice:
          example: Bob Johnson
          type: string
        address:
          allOf:
          - $ref: '#/components/schemas/Address'
          deprecated: true
          description: "Deprecated: use billing_addresses. In responses, the first\
            \ address in billing_addresses. In requests without billing_addresses,\
            \ it creates or edits that first billing address in place; the customer's\
            \ other billing addresses are left untouched."
        shipping_address:
          allOf:
          - $ref: '#/components/schemas/Address'
          deprecated: true
          description: "Deprecated: use shipping_addresses. In responses, the first\
            \ address in shipping_addresses. In requests without shipping_addresses,\
            \ it creates or edits that first shipping address in place; the customer's\
            \ other shipping addresses are left untouched."
        billing_addresses:
          allOf:
          - $ref: '#/components/schemas/CustomerAddresses'
          description: "All of the customer's billing addresses, returned in a stable\
            \ order; the first is the default for new contracts and invoices. On update\
            \ the list is authoritative: addresses sent with an id are updated, addresses\
            \ without an id are added, and stored addresses left out are removed.\
            \ Removing an address that is used by a contract or an invoice that can\
            \ still be edited is rejected with a 400 naming those documents. Omit\
            \ to leave billing addresses unchanged; send an empty list to remove them\
            \ all. Cannot be combined with address."
          nullable: true
        shipping_addresses:
          allOf:
          - $ref: '#/components/schemas/CustomerAddresses'
          description: All of the customer's shipping addresses. Same rules as billing_addresses.
            Cannot be combined with shipping_address.
          nullable: true
        emails:
          description: "All of the customer's emails. On update, send the full list:\
            \ emails with an id are kept or edited, emails without an id are added,\
            \ and emails left out are removed (omitting emails, or sending an empty\
            \ list, removes them all). A removed email is also removed from every\
            \ contract email_selection; to change an email and keep it selected, send\
            \ its id. Rejected: an id on create, an id that doesn't belong to this\
            \ customer, the same id twice, or the same address and type twice (addresses\
            \ are compared ignoring case and surrounding spaces)."
          items:
            $ref: '#/components/schemas/CustomerEmail'
          type: array
        external_references:
          items:
            $ref: '#/components/schemas/ExternalReference'
          type: array
          uniqueItems: true
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        send_invoices_automatically:
          default: false
          description: "When set to true, invoices for this customer will be automatically\
            \ sent via email on the invoice date."
          type: boolean
        send_payment_reminders:
          default: false
          description: "When set to true, an email will be sent to customers periodically\
            \ if they have not paid an invoice."
          type: boolean
        allow_online_payments:
          description: "Allows this customer to pay invoices online via Stripe, and\
            \ must be true before auto-payment can be set up for them. Omit on create\
            \ to leave online payments off; omit on update to keep the customer's\
            \ current setting. Enabling it requires Stripe to be configured for at\
            \ least one subsidiary."
          type: boolean
        fields:
          allOf:
          - $ref: '#/components/schemas/FieldAssignments'
          nullable: true
        tax_ids:
          allOf:
          - $ref: '#/components/schemas/CustomerTaxIds'
          description: "The customer's tax IDs. Omit on create for no tax IDs. On\
            \ update, omit to keep the current tax IDs, send an empty list to clear\
            \ them, or send a list to replace them all. Adding or changing tax IDs\
            \ requires the customer to have an address, and they are validated with\
            \ the organization's tax provider when one is connected."
          nullable: true
      required:
      - name
    CustomerTaxIds:
      items:
        $ref: '#/components/schemas/CustomerTaxId'
      type: array
    CustomerTaxId:
      properties:
        type:
          enum:
          - EU_VAT_REGISTRATION_NUMBER
          - GENERIC_VAT_NUMBER
          type: string
        value:
          example: DE123456789
          minLength: 1
          type: string
      required:
      - type
      - value
    UpdateCustomerRequest:
      allOf:
      - $ref: '#/components/schemas/CustomerRequest'
      - properties:
          metadata:
            allOf:
            - $ref: '#/components/schemas/InlineMetadataValues'
            nullable: true
      example:
        metadata: ""
        address: ""
        tax_ids: ""
        billing_addresses: ""
        shipping_addresses: ""
        payment_terms: 0
        send_invoices_automatically: false
        emails:
        - id: 0193a6f2-4c1e-7b8a-9d3f-2e5c8a1b7f40
          type: MAIN_SENDER
          email: bobjohnson@somedomain.com
        - id: 0193a6f2-4c1e-7b8a-9d3f-2e5c8a1b7f40
          type: MAIN_SENDER
          email: bobjohnson@somedomain.com
        name_on_invoice: Bob Johnson
        allow_online_payments: true
        name: Bob
        send_payment_reminders: false
        shipping_address: ""
        fields: ""
        external_references:
        - id: "234"
          type: xyzSystemId
          url: https://xyzsystempage.com/ids/234
        - id: "234"
          type: xyzSystemId
          url: https://xyzsystempage.com/ids/234
    PaymentSetupResponse:
      example:
        setup_url: https://openapi-generator.tech
      properties:
        setup_url:
          description: URL to the payment setup portal
          format: uri
          type: string
      required:
      - setup_url
    CustomerPaymentMethod:
      example:
        chargeable: true
        payment_type: CARD
        last_four_digits: last_four_digits
      properties:
        last_four_digits:
          description: The last four digits of the payment method.
          type: string
        chargeable:
