          - "Equity, Compensation"
          - Other Current Liability
          - Other Long Term Liability
          - Accounts Payable
          - Accounts Receivable
          - Credit Card
          - Fixed Assets
          - Accumulated Depreciation
          - Other Current Asset
          - Bank
