        propertyName: scope
      example:
        scope: FULL
      oneOf:
      - $ref: '#/components/schemas/CreateFullContractRequest'
      - $ref: '#/components/schemas/CreateRevenueRecognitionOnlyContractRequest'
      properties:
        scope:
          $ref: '#/components/schemas/ContractScope'
      required:
      - scope
    UpdateContractRequest:
      discriminator:
        mapping:
          FULL: '#/components/schemas/UpdateFullContractRequest'
          REVENUE_RECOGNITION_ONLY: '#/components/schemas/UpdateRevenueRecognitionOnlyContractRequest'
        propertyName: scope
      oneOf:
      - $ref: '#/components/schemas/UpdateFullContractRequest'
