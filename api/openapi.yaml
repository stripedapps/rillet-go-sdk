openapi: 3.1.0
info:
  title: Rillet Accounting API
  version: v4.0
servers:
- description: Production server url
  url: https://api.rillet.com
- description: Test server url
  url: https://sandbox.api.rillet.com
security:
- bearerAuth: []
paths:
  /accounts:
    get:
      description: |
        Returns the chart of accounts for the organization tied to the API credentials.
        Use optional filters (for example updated.gt) to sync only accounts changed since a prior run.
        Account ids are stable identifiers used when creating journal entries, bills, and other postings.
      operationId: list-all-accounts
      parameters:
      - description: Filter accounts updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_accounts_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all accounts
      tags:
      - Chart of Accounts
    post:
      description: |
        Adds an account to the chart of accounts for the organization.
        The account currency is inherited from the organization, its status is ACTIVE, and its default grouping and closing behavior are derived from the selected type and subtype.
      operationId: create-an-account
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates an account
      tags:
      - Chart of Accounts
  /chart-of-accounts:
    post:
      description: |
        Initializes the entire chart of accounts for a bare organization in one atomic call.
        The organization must have no existing chart of accounts; otherwise the request fails with 409.
        The complete request is validated before any accounts or groups are created; validation failures return 400 without leaving a partial chart of accounts.

        Structural invariants match CSV import: exactly one `Accounts Receivable`, `Accounts Payable`, `Sales Tax Liability`, and `Retained Earnings`;
        at least one `Unbilled Revenue`, `Prepaid Expense`, and `Deferred Revenue`.
        The same default group scaffold as CSV import is created.
        Each account's optional `parent_grouping` reuses a scaffold group by name or creates a nested group under the account type root.
        When the request contains exactly one `Prepaid Expense` account, expense accounts may omit `prepaid_account_code` to default to it;
        when it contains multiple `Prepaid Expense` accounts, each expense account must reference one by code.
        `Cash in Transit` is auto-created and must not appear in the request.
      operationId: create-a-chart-of-accounts
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChartOfAccountsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_accounts_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a chart of accounts
      tags:
      - Chart of Accounts
  /subsidiaries:
    get:
      description: |
        Returns legal-entity and elimination subsidiaries for your organization, limited by your access permissions.
        Each subsidiary includes its ID, currency, and timezone. Use its ID with endpoints that require `subsidiary_id`.
        Legal entity subsidiaries also include `legal_name`, `address` and `tax_id`, as shown in Settings → Subsidiary Details.

        When the hierarchy feature and hierarchy API support are both enabled for your organization:

        - Each subsidiary includes `parent_subsidiary_id`: its direct parent's ID, or `null` if it has no parent.
        - The response includes `root_subsidiary_id`: the ID of the configured hierarchy root.
          The root can differ from the default subsidiary.

        Otherwise, both fields are omitted.
        Parent and root IDs are included even if you cannot access those subsidiaries.
        The root ID is included even when the list is empty.
        Use a token with access to all subsidiaries to read the complete hierarchy.
      operationId: list-all-subsidiaries
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_subsidiaries_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all subsidiaries
      tags:
      - Subsidiaries
  /subsidiaries/{subsidiary_id}:
    get:
      description: |
        Returns one subsidiary from your organization. Returns 404 if it does not exist or you cannot access it.
        Use `GET /subsidiaries` to find a subsidiary ID.
        Legal entity subsidiaries also include `legal_name`, `address` and `tax_id`, as shown in Settings → Subsidiary Details.

        When the hierarchy feature and hierarchy API support are both enabled for your organization,
        the response includes `parent_subsidiary_id`. This is the direct parent's ID, or `null` if there is no parent.
        The parent ID is included even if you cannot access the parent.
        If either feature is disabled, `parent_subsidiary_id` is omitted.
      operationId: retrieve-a-subsidiary
      parameters:
      - description: UUID of the subsidiary to retrieve (must belong to the organization).
        explode: false
        in: path
        name: subsidiary_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subsidiary'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a subsidiary
      tags:
      - Subsidiaries
  /organizations/self:
    get:
      description: |
        Returns the organization profile for the API credentials in use (the “current” org).
        Use this to confirm organization id, display name, and other org-level settings in integrations.
      operationId: retrieve-an-organization
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves an organization
      tags:
      - Organizations
  /members:
    get:
      description: |
        Returns the identity of each member of the organization tied to the API credentials.
        This endpoint carries identity only (id, user, email, name, status); it does not return role
        assignments. Use list-role-assignments to discover which member is assigned which role, and
        list-roles to resolve what each role authorizes.
      operationId: list-members
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_members_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists organization members
      tags:
      - Members
  /roles:
    get:
      description: |
        Returns every role defined in the organization along with the flat set of permission keys it
        grants. Each permission is an opaque, colon-delimited string; treat it as an opaque identifier
        and do not rely on its internal structure.
      operationId: list-roles
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_roles_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists roles
      tags:
      - Roles
  /role-assignments:
    get:
      description: |
        Returns which organization member is assigned which role and the scope of that assignment.
        References roles and members by id only; join against list-roles and list-members
        to resolve names. This endpoint is not the source of truth for role or subsidiary names.
      operationId: list-role-assignments
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - description: Filter assignments to a single organization member.
        explode: true
        in: query
        name: member_id
        required: false
        schema:
          example: 0199e21a-14c2-7abc-9d3e-112233445566
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_role_assignments_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists role assignments
      tags:
      - Roles
  /approval-workflows:
    get:
      description: |
        Returns every approval workflow in the organization tied to the API credentials, active and inactive,
        grouped by the kind of record they apply to and ordered by ascending `priority` within each group.

        This endpoint is not paginated and returns the complete set.
      operationId: list-all-approval-workflows
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_approval_workflows_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all approval workflows
      tags:
      - Approval Workflows
  /approval-workflows/{approval_workflow_id}:
    get:
      description: |
        Returns one approval workflow: the conditions that decide which entries it applies to, and the ordered
        layers of approvers that must sign off. This is the control definition, not a record of approvals given.
        Approval workflows are not versioned — the response describes the workflow as it stands now, and an
        update overwrites it in place.
      operationId: retrieve-an-approval-workflow
      parameters:
      - description: UUID of the approval workflow to be used in this operation.
        explode: false
        in: path
        name: approval_workflow_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflow'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves an approval workflow
      tags:
      - Approval Workflows
    put:
      description: |
        Replaces an approval workflow's definition. The whole definition is required — a partial body is
        rejected, not merged, and fields this contract does not define are ignored. Send `type` and
        `active` back as read; changing either here is rejected, and combinations the Rillet app cannot
        configure are rejected too (see the individual fields).

        Entries already awaiting approval are unaffected, because an entry copies the layers it needs when
        approval starts; only entries registered after this call use the new definition. Deadlines and layer
        escalation rules are not part of this contract and are cleared, exactly as saving a workflow in
        Rillet clears them.
      operationId: update-an-approval-workflow
      parameters:
      - description: UUID of the approval workflow to be used in this operation.
        explode: false
        in: path
        name: approval_workflow_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflowRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflow'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates an approval workflow
      tags:
      - Approval Workflows
  /products:
    get:
      description: |
        Returns sellable products and services for accounts receivable (contracts, invoices).
        Supports pagination and optional filters such as status, currency and type.
      operationId: list-all-products
      parameters:
      - description: Optional status filter (allowed values depend on the resource).
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - description: Optional ISO currency code filter.
        explode: true
        in: query
        name: currency
        required: false
        schema:
          $ref: '#/components/schemas/CurrencyCode'
        style: form
      - description: Optional product type filter.
        explode: false
        in: query
        name: type
        required: false
        schema:
          items:
            $ref: '#/components/schemas/ProductType'
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_products_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all products
      tags:
      - Products
    post:
      description: |
        Creates a new product (good or service) that can be referenced on contracts and invoices.
        Choose pricing and revenue behavior consistent with how you bill customers (one-time, recurring, usage, etc.).
        Set type to BUNDLE to create a bundle.
      operationId: create-a-product
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a product
      tags:
      - Products
  /products/{product_id}:
    delete:
      description: |
        Permanently removes a product or bundle. Ensure no in-flight contracts or invoices require this product before deleting.
      operationId: delete-a-product
      parameters:
      - description: UUID of the product to delete.
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a product
      tags:
      - Products
    get:
      description: |
        Returns a single product or bundle definition, including pricing configuration used on contracts and invoices.
      operationId: retrieve-a-product
      parameters:
      - description: UUID of the product to retrieve.
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a product
      tags:
      - Products
    put:
      description: |
        Updates a single product or bundle definition in the catalog.
        IMPORTANT: This is a full-replace operation (PUT semantics). Include every field expected by ProductRequest;
        omitted fields may be cleared. Call retrieve-a-product first, merge your changes, then submit the full body.
      operationId: update-a-product
      parameters:
      - description: UUID of the product to update.
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates a product
      tags:
      - Products
  /products/{product_id}/refresh-bundle:
    post:
      description: |
        Updates the details the bundle keeps for each component product to the products' current values.
        Contracts that already sold the bundle don't change.
      operationId: refresh-a-bundle
      parameters:
      - description: UUID of the bundle to refresh.
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Refreshes a bundle
      tags:
      - Products
  /customers:
    get:
      description: |
        Returns customers for accounts receivable with pagination and optional search or external-reference filters.
      operationId: list-all-customers
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - description: Filter customer by name.
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: |
          If this is provided, `external_reference_type` must also be provided.
        explode: true
        in: query
        name: external_reference_id
        required: false
        schema:
          type: string
        style: form
      - description: |
          If this is provided, `external_reference_id` must also be provided.
        explode: true
        in: query
        name: external_reference_type
        required: false
        schema:
          type: string
        style: form
      - description: Filter customers updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      - description: the field the customers should be sorted by descending (either
          created or updated)
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: created
          enum:
          - created
          - updated
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_customers_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all customers
      tags:
      - Customers
    post:
      description: |
        Creates a new customer in the Accounts Receivable catalog.
        Required fields: name. When providing a billing or shipping address, line1, city,
        zip_code, and country are required. State is required for United States addresses
        (use a 2-letter code such as 'TN' or 'CA') and may be omitted where it does not apply.
      operationId: create-a-customer
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a customer
      tags:
      - Customers
  /customers/{customer_id}:
    delete:
      description: |
        Permanently deletes a customer. Verify no active contracts or open invoices reference this customer first.
      operationId: delete-a-customer
      parameters:
      - description: UUID of the customer to delete.
        explode: false
        in: path
        name: customer_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a customer
      tags:
      - Customers
    get:
      description: |
        Returns a single customer record including billing profile details, which are needed for updates.
      operationId: retrieve-a-customer
      parameters:
      - description: UUID of the customer to retrieve.
        explode: false
        in: path
        name: customer_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a customer
      tags:
      - Customers
    put:
      description: |
        Updates a single customer record in the catalog.
        IMPORTANT: This is a full-replace operation (PUT semantics). All fields must be
        included in the request body — omitting any field will set it to null, wiping
        existing data. Always call retrieve-a-customer first to fetch the current record,
        then include ALL existing fields in your update request along with your changes.
        Exceptions that keep stored data when the field is omitted:
        - metadata: omit it to keep all existing metadata, or send only the keys you want to set or clear.
        - addresses: omit address and billing_addresses to keep the stored billing addresses, and likewise
          shipping_address and shipping_addresses. This is for backward compatibility: integrations built
          before customers could have several addresses won't wipe the ones they don't send.
      operationId: update-a-customer
      parameters:
      - description: UUID of the customer to be used in this operation.
        explode: false
        in: path
        name: customer_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates a customer
      tags:
      - Customers
  /customers/{customer_id}/settings/payment:
    get:
      description: Returns the payment method configured for auto-payment for the
        given customer.
      operationId: get-payment-method
      parameters:
      - description: UUID of the customer to be used in this operation.
        explode: false
        in: path
        name: customer_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPaymentMethod'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Gets payment method
      tags:
      - Customer Payments
    post:
      description: "Kicks off the setup of auto-payment for a customer. This will\
        \ return a URL that the customer must visit to complete the setup. If the\
        \ customer already has a payment method, this will return a URL to update\
        \ the payment method."
      operationId: setup-auto-payment
      parameters:
      - description: UUID of the customer to be used in this operation.
        explode: false
        in: path
        name: customer_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupUpAutoPaymentRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSetupResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Sets up auto-payment
      tags:
      - Customer Payments
      x-skip-mcp: true
  /customer-families:
    get:
      description: |
        Returns customer families with pagination and optional search or update filters.
        The response does not include members; use list-customer-family-members to read them.
      operationId: list-all-customer-families
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - description: Filter customer families by name.
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Filter customer families updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      - description: the field the customer families should be sorted by descending
          (either created or updated)
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: created
          enum:
          - created
          - updated
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_customer_families_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all customer families
      tags:
      - Customer Families
    post:
      description: |
        Creates a family from customers that do not already belong to one. A child may report to
        another child, so a multi-level hierarchy is created in one call.
      operationId: create-a-customer-family
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerFamilyRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerFamily'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a customer family
      tags:
      - Customer Families
  /customer-families/{customer_family_id}:
    delete:
      description: |
        Dissolves the grouping. Every member becomes a standalone customer; no customer is deleted.
      operationId: delete-a-customer-family
      parameters:
      - description: UUID of the customer family to dissolve.
        explode: false
        in: path
        name: customer_family_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Dissolves a customer family
      tags:
      - Customer Families
    get:
      description: |
        Returns a single customer family with its name, root parent and member count.
        The response does not include members; use list-customer-family-members to read them.
      operationId: retrieve-a-customer-family
      parameters:
      - description: UUID of the customer family to retrieve.
        explode: false
        in: path
        name: customer_family_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerFamily'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a customer family
      tags:
      - Customer Families
    patch:
      description: |
        Changes the family's name. Membership is untouched: anything else in the body is ignored,
        so use the members endpoints to change who belongs.
      operationId: rename-a-customer-family
      parameters:
      - description: UUID of the customer family to rename.
        explode: false
        in: path
        name: customer_family_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameCustomerFamilyRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerFamily'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Renames a customer family
      tags:
      - Customer Families
  /customer-families/{customer_family_id}/members:
    get:
      description: |
        Returns the members of a customer family with pagination. Each member names the member it
        reports to, so you can rebuild the tree. Newest first, not alphabetical.
      operationId: list-customer-family-members
      parameters:
      - description: UUID of the customer family whose members are listed.
        explode: false
        in: path
        name: customer_family_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - description: Filter members by customer name.
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: |
          Return only the direct children of this member. Omit it to page the whole family.
          Passing a customer from a different family gives you an empty page rather than an error.
        explode: true
        in: query
        name: parent_customer_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: the field the members should be sorted by descending (either
          created or updated)
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: created
          enum:
          - created
          - updated
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_customer_family_members_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists the members of a customer family
      tags:
      - Customer Families
    post:
      description: |
        Adds customers to a family and moves members already in it, in one call. Naming a member
        that already belongs gives it a new parent, so a branch can be restructured in a single
        request rather than through a sequence that would be invalid halfway through.
      operationId: add-customer-family-members
      parameters:
      - description: UUID of the customer family to add members to.
        explode: false
        in: path
        name: customer_family_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerFamilyMembersRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerFamily'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Adds members to a customer family
      tags:
      - Customer Families
  /customer-families/{customer_family_id}/members/{customer_id}:
    delete:
      description: |
        Removes one customer from the family; the customer itself is untouched. Anyone reporting to
        it moves up to its own parent. If this would leave the family with a single member it is
        dissolved instead. The root parent cannot be removed this way: dissolve the family instead.
      operationId: remove-a-customer-family-member
      parameters:
      - description: UUID of the customer family to remove the member from.
        explode: false
        in: path
        name: customer_family_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: UUID of the customer to remove from the family.
        explode: false
        in: path
        name: customer_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Removes a member from a customer family
      tags:
      - Customer Families
  /contracts/preview-invoice-schedule:
    post:
      description: "Computes and returns the invoice schedule the given contract would\
        \ produce, without creating the contract or persisting anything."
      operationId: preview-invoice-schedule
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractInvoiceSchedule'
          description: The computed invoice schedule
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Preview the invoice schedule for a contract
      tags:
      - Contracts
  /contracts:
    get:
      description: |
        Returns contracts with pagination and rich filters (subsidiary, customer, status, date ranges).
        Use this to discover contract ids, check lifecycle state, or drive reporting extracts.
      operationId: list-all-contracts
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/subsidiary_id'
      - description: Optional status filter (allowed values depend on the resource).
        explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/ContractStatus'
        style: form
      - description: Minimum start date value to filter by (exclusive)
        explode: true
        in: query
        name: start_date.gt
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Minimum start date value to filter by (inclusive)
        explode: true
        in: query
        name: start_date.gte
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Maximum start date value to filter by (exclusive)
        explode: true
        in: query
        name: start_date.lt
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Maximum start date value to filter by (inclusive)
        explode: true
        in: query
        name: start_date.lte
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Minimum end date value to filter by (exclusive)
        explode: true
        in: query
        name: end_date.gt
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Minimum end date value to filter by (inclusive)
        explode: true
        in: query
        name: end_date.gte
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Maximum end date value to filter by (exclusive)
        explode: true
        in: query
        name: end_date.lt
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Maximum end date value to filter by (inclusive)
        explode: true
        in: query
        name: end_date.lte
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Optional UUID filter by customer.
        explode: true
        in: query
        name: customer_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_contracts_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all contracts
      tags:
      - Contracts
    post:
      description: |
        Rillet supports two contract scope types: FULL and REVENUE_RECOGNITION_ONLY. The selected scope determines how the invoices are created and what information the user needs to provide.

        The FULL scope is used when contract invoices are generated and sent directly from Rillet. In this case, Rillet automatically assigns the invoice numbers.

        The REVENUE_RECOGNITION_ONLY scope is intended for situations where contracts and invoices are issued from another system and only need to be recorded in Rillet for accounting purposes. In this workflow, users must provide the invoice numbers manually. Other fields can be populated based on the data imported from the external system.

        For example, if your organization issues invoices through an external billing platform but tracks financials in Rillet, you should select REVENUE_RECOGNITION_ONLY. If Rillet handles the entire invoicing and sending process, choose the FULL scope.
      operationId: create-a-contract
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandedContract'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPendingApproval'
          description: |
            Accepted: a contract approval rule matched, so the contract was not created yet. It waits as a draft contract until the approval
            request is approved, and is then created with the same id. Only returned when contract approvals are turned on for the organization.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a contract
      tags:
      - Contracts
      x-rillet-contract-submission-response: true
  /contracts/{contract_id}:
    delete:
      description: |
        Permanently removes a contract when your business rules allow deletion.
        Confirm downstream invoices, revenue schedules, and integrations no longer depend on this contract before deleting it.
      operationId: delete-a-contract
      parameters:
      - description: UUID of the contract to delete.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a contract
      tags:
      - Contracts
    get:
      description: |
        Returns the expanded contract including items, schedules, and metadata required before updates or amendments.
        Always retrieve before issuing a full PUT update so you preserve fields you do not intend to clear.
      operationId: retrieve-a-contract
      parameters:
      - description: UUID of the contract to retrieve.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandedContract'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a contract
      tags:
      - Contracts
  /contracts/{contract_id}/milestones/{milestone_ref}/completion:
    delete:
      description: "Removes the current completion and its recognition effect without\
        \ cancelling the milestone, issuing a credit, or changing its allocation.\
        \ The milestone must currently be completed. The milestone change and required\
        \ revenue journal regeneration commit atomically."
      operationId: reverse-a-milestone-completion
      parameters:
      - description: UUID of the contract that owns the milestone.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Milestone UUID or stable key. A key must identify exactly one
          milestone in the contract.
        explode: false
        in: path
        name: milestone_ref
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractMilestone'
          description: The updated pending milestone.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Reverses a milestone completion
      tags:
      - Contracts
    put:
      description: Creates or fully replaces the current completion on a milestone
        in a FULL contract. The reference may be the milestone UUID or its case-insensitive
        key. The completion date must fall within the owning line term. Omitted or
        null memo and external_references values clear those fields. An identical
        request is a no-op. The milestone change and required revenue journal regeneration
        commit atomically.
      operationId: update-a-milestone-completion
      parameters:
      - description: UUID of the contract that owns the milestone.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Milestone UUID or stable key. A key must identify exactly one
          milestone in the contract.
        explode: false
        in: path
        name: milestone_ref
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMilestoneCompletionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractMilestone'
          description: The updated milestone.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Records or corrects a milestone completion
      tags:
      - Contracts
  /contracts/{contract_id}/milestones/{milestone_ref}/cancellation:
    put:
      description: "Permanently forfeits a pending milestone allocation on a FULL\
        \ contract without redistributing it or automatically issuing a refund. A\
        \ nonzero allocation creates a linked credit memo; zero allocations do not.\
        \ Retrying the saved effective_date is a no-op, while a different date conflicts.\
        \ Completed milestones must be reversed before cancellation."
      operationId: cancel-a-milestone
      parameters:
      - description: UUID of the contract that owns the milestone.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Milestone UUID or stable key. A key must identify exactly one
          milestone in the contract.
        explode: false
        in: path
        name: milestone_ref
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelMilestoneRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractMilestone'
          description: The permanently cancelled milestone.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Permanently cancels a pending milestone
      tags:
      - Contracts
  /contracts/{contract_id}/amendments:
    post:
      description: |
        Applies a contract amendment when you need to add items, retire items, or change pricing/invoicing after go-live.
        Unlike a full PUT update, amendments model business-time changes and preserve historical billing context.

        Use preview-contract-amendment to dry-run the financial impact before committing.
      operationId: amend-a-contract
      parameters:
      - description: UUID of the contract to amend.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendContractRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandedContract'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPendingApproval'
          description: |
            Accepted: a contract approval rule matched, so the amendment was not applied yet. The contract, its invoices and credit memos stay as
            they are until the approval request is approved, and the amendment is then applied as it was sent. Only returned when contract
            approvals are turned on for the organization.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Amends a contract
      tags:
      - Contracts
      x-rillet-contract-submission-response: true
  /contracts/{contract_id}/amendments/preview:
    post:
      description: "Preview a contract that has been amended. This has no effect on\
        \ the actual contract, only provides a preview of what a contract will look\
        \ like after it is amended."
      operationId: preview-contract-amendment
      parameters:
      - description: UUID of the contract whose amendment you are previewing.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewContractAmendmentRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandedContract'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Previews contract amendment
      tags:
      - Contracts
  /contracts/{contract_id}/end:
    put:
      description: |
        Sets an explicit end date on a contract that previously had no close date (open-ended).
        Provide the final end_date in the request body; downstream invoicing and revenue recognition honor the new boundary.
      operationId: end-an-open-ended-contract
      parameters:
      - description: UUID of the open-ended contract to close.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndOpenEndedContractRequest'
        required: true
      responses:
        "204":
          description: NO CONTENT
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Ends an open-ended contract
      tags:
      - Contracts
  /contracts/{contract_id}/documents:
    get:
      description: |
        Returns all attached documents, including those uploaded through the Rillet application or imported from Salesforce.
        Each download URL is valid for up to 1 hour; call this endpoint again to obtain fresh URLs.
        Documents are listed oldest first.
        Returns an empty `documents` array when the contract has no attachments.
      operationId: list-contract-documents
      parameters:
      - description: UUID of the contract to be used in this operation.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_contract_documents_200_response'
          description: Attached documents
        "400":
          description: Malformed contract id
        "404":
          description: Contract not found or not accessible
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists documents attached to a contract
      tags:
      - Contract Documents
    parameters:
    - description: UUID of the contract to be used in this operation.
      explode: false
      in: path
      name: contract_id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: |
        Attaches one PDF, JPEG, PNG, or XLSX file to an existing contract.
        Existing attachments are preserved, including files uploaded through the Rillet application
        or imported from Salesforce.
        Repeating an upload creates another attachment.
        A file may be at most 9 MiB. The upload is refused when the contract already has 20 attachments,
        or when it would take the contract's attachments past 100 MiB in total; files uploaded through
        the Rillet application or imported from Salesforce count toward both limits.
        A file name may have at most 255 characters and must not contain a path.
      operationId: upload-contract-document
      parameters:
      - description: UUID of the contract to be used in this operation.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: "application/pdf, image/jpeg, image/png, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                style: form
            schema:
              $ref: '#/components/schemas/upload_contract_document_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDocument'
          description: Document attached
        "400":
          description: "Empty file, missing filename, unsupported file content, or\
            \ attachment limit reached"
        "404":
          description: Contract not found or not accessible
        "409":
          description: |
            Other uploads kept changing the contract's attachments; retry the upload.
            Or the size of an existing attachment cannot be read; the error names it so it can be removed or re-uploaded.
            Or a change to the contract is waiting for approval; upload once it is approved, rejected or cancelled.
        "413":
          description: "The file is over 9 MiB, or the contract's attachments would\
            \ exceed 100 MiB in total"
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Uploads a document to a contract
      tags:
      - Contract Documents
  /contracts/{contract_id}/documents/{document_id}:
    delete:
      description: |
        Removes one attachment from a contract. The stored file is deleted unless another
        contract or a milestone still uses it, or the file belongs to another part of Rillet.
        Works for files uploaded through the API or the Rillet application, or imported from Salesforce.
      operationId: delete-a-contract-document
      parameters:
      - description: UUID of the contract to be used in this operation.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id returned by the upload or list endpoint.
        explode: false
        in: path
        name: document_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Document removed
        "400":
          description: Malformed contract or document id
        "404":
          description: "Contract not found or not accessible, or the document is not\
            \ attached to this contract"
        "409":
          description: |
            Other requests kept changing the contract's attachments; retry the deletion.
            Or a change to the contract is waiting for approval; delete once it is approved, rejected or cancelled.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a document from a contract
      tags:
      - Contract Documents
    parameters:
    - description: UUID of the contract to be used in this operation.
      explode: false
      in: path
      name: contract_id
      required: true
      schema:
        type: string
      style: simple
    - description: The id returned by the upload or list endpoint.
      explode: false
      in: path
      name: document_id
      required: true
      schema:
        type: string
      style: simple
  /contracts/{contract_id}/metadata:
    get:
      description: |
        Returns this contract's metadata values keyed by definition key. Keys with no value are
        omitted, including values held by archived definitions, which stay readable here.
        Definition names, types and status come from list-all-metadata-definitions.
      operationId: retrieve-contract-metadata
      parameters:
      - description: UUID of the contract to retrieve metadata for.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValues'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves contract metadata
      tags:
      - Contracts
    patch:
      description: |
        Partial update. Keys omitted from the request body are left unchanged; send a key with a
        null, empty, or whitespace-only value to clear it. Prefer this over
        update-contract-metadata when setting or clearing individual keys, as it cannot disturb
        keys you did not name. Archived keys may only be cleared, never changed. Every key must
        name a definition assigned to contracts: an unknown key, or one assigned only to another
        entity type, fails the request with a 400. Keys are never silently ignored. The write is
        atomic: if any key fails validation, nothing is written.
      operationId: patch-contract-metadata
      parameters:
      - description: UUID of the contract to patch metadata for.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMetadataValuesRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValues'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Patches contract metadata
      tags:
      - Contracts
    put:
      description: |
        IMPORTANT: This is a full-replace operation (PUT semantics). Every active metadata key
        omitted from the request body is cleared. To set or clear individual keys without
        disturbing the rest, use patch-contract-metadata instead. Null, empty, and
        whitespace-only values clear a single key. Archived keys may only be cleared, never changed.
        Every key must name a definition assigned to contracts: an unknown key, or one assigned
        only to another entity type, fails the request with a 400. Keys are never silently
        ignored. The write is atomic: if any key fails validation, nothing is written.
      operationId: update-contract-metadata
      parameters:
      - description: UUID of the contract to update metadata for.
        explode: false
        in: path
        name: contract_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataValuesRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValues'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates contract metadata
      tags:
      - Contracts
  /contracts/metadata/bulk:
    post:
      description: |
        Patches metadata on up to 1,000 contracts in one atomic request. Each contract may receive
        different values. If a contract is missing or any key or value is invalid, nothing is
        written for any contract. Per contract this behaves exactly like patch-contract-metadata:
        keys omitted for that contract are left unchanged; null, empty, and whitespace-only values
        clear that key.
      operationId: bulk-update-contract-metadata
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateContractMetadataRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateContractMetadataResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates metadata for multiple contracts
      tags:
      - Contracts
  /draft-contracts/{draft_contract_id}:
    delete:
      description: Permanently removes a draft contract along with its line items
        and external references. Use this to programmatically reject a draft contract
        instead of doing it from the Rillet UI.
      operationId: delete-a-draft-contract
      parameters:
      - description: UUID of the draft contract to be used in this operation.
        explode: false
        in: path
        name: draft_contract_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a draft contract
      tags:
      - Draft Contracts
    get:
      description: "Returns a draft contract by id, including its line items and any\
        \ attached external references."
      operationId: retrieve-a-draft-contract
      parameters:
      - description: UUID of the draft contract to be used in this operation.
        explode: false
        in: path
        name: draft_contract_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftContract'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a draft contract
      tags:
      - Draft Contracts
    parameters:
    - description: UUID of the draft contract to be used in this operation.
      explode: false
      in: path
      name: draft_contract_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    put:
      description: |
        Replaces the draft contract identified by `draft_contract_id` with the supplied payload. The body shape
        matches `POST /draft-contracts` — items and external_references on the existing record are fully replaced.
        Returns 404 if the id is not a draft contract in the organization.

        Exceptions that keep stored data when the field is omitted:
        - shipping_customer_id, billing_address_id, shipping_address_id: omit them to keep the draft's current
          ship-to customer and addresses, or send null to clear them.
        - email_selection: omit it to keep the draft's current recipients.

        This is for backward compatibility: integrations built before these fields existed won't clear them on every
        update. Kept values that no longer fit are dropped: the billing address and email selection when customer_id
        changes, a ship-to customer that was the previous billing customer, and any address or email its customer no
        longer holds.
      operationId: update-a-draft-contract
      parameters:
      - description: UUID of the draft contract to be used in this operation.
        explode: false
        in: path
        name: draft_contract_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftContractRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftContract'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates a draft contract
      tags:
      - Draft Contracts
  /draft-contracts/{draft_contract_id}/documents:
    get:
      description: |
        Returns all attached documents, including those uploaded through the Rillet application or imported from Salesforce.
        Each download URL is valid for up to 1 hour; call this endpoint again to obtain fresh URLs.
        Documents are listed oldest first.
        Returns an empty `documents` array when the draft contract has no attachments.
        Once the draft contract is confirmed, its documents are listed on the contract instead.
      operationId: list-draft-contract-documents
      parameters:
      - description: UUID of the draft contract to be used in this operation.
        explode: false
        in: path
        name: draft_contract_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_contract_documents_200_response'
          description: Attached documents
        "400":
          description: Malformed draft contract id
        "404":
          description: Draft contract not found or not accessible
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists documents attached to a draft contract
      tags:
      - Draft Contract Documents
    parameters:
    - description: UUID of the draft contract to be used in this operation.
      explode: false
      in: path
      name: draft_contract_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    post:
      description: |
        Attaches one PDF, JPEG, PNG, or XLSX file to an existing draft contract.
        Existing attachments are preserved, including files uploaded through the Rillet application
        or imported from Salesforce.
        Repeating an upload creates another attachment.
        A file may be at most 9 MiB. The upload is refused when the draft contract already has 20 attachments,
        or when it would take the draft contract's attachments past 100 MiB in total; files uploaded through
        the Rillet application or imported from Salesforce count toward both limits.
        A file name may have at most 255 characters and must not contain a path.
        When the draft contract is confirmed, its attachments move to the contract.
        Re-creating the draft contract with POST /draft-contracts and the same external reference discards
        its attachments; use PUT to change a draft contract.
      operationId: upload-draft-contract-document
      parameters:
      - description: UUID of the draft contract to be used in this operation.
        explode: false
        in: path
        name: draft_contract_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: "application/pdf, image/jpeg, image/png, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                style: form
            schema:
              $ref: '#/components/schemas/upload_contract_document_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDocument'
          description: Document attached
        "400":
          description: "Empty file, missing filename, unsupported file content, or\
            \ attachment limit reached"
        "404":
          description: Draft contract not found or not accessible
        "409":
          description: |
            Other uploads kept changing the draft contract's attachments; retry the upload.
            Or the size of an existing attachment cannot be read; the error names it so it can be removed or re-uploaded.
        "413":
          description: "The file is over 9 MiB, or the draft contract's attachments\
            \ would exceed 100 MiB in total"
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Uploads a document to a draft contract
      tags:
      - Draft Contract Documents
  /draft-contracts/{draft_contract_id}/documents/{document_id}:
    delete:
      description: |
        Removes one attachment from a draft contract. The stored file is deleted unless a contract,
        another draft contract or a milestone still uses it, or the file belongs to another part of Rillet.
        Works for files uploaded through the API or the Rillet application, or imported from Salesforce.
        A file imported from Salesforce stays removed when the draft contract is imported again, unless
        a newer version of it is uploaded in Salesforce.
      operationId: delete-a-draft-contract-document
      parameters:
      - description: UUID of the draft contract to be used in this operation.
        explode: false
        in: path
        name: draft_contract_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The id returned by the upload or list endpoint.
        explode: false
        in: path
        name: document_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Document removed
        "400":
          description: Malformed draft contract or document id
        "404":
          description: "Draft contract not found or not accessible, or the document\
            \ is not attached to this draft contract"
        "409":
          description: The draft contract changed while the document was being removed;
            retry the request.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a document from a draft contract
      tags:
      - Draft Contract Documents
    parameters:
    - description: UUID of the draft contract to be used in this operation.
      explode: false
      in: path
      name: draft_contract_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    - description: The id returned by the upload or list endpoint.
      explode: false
      in: path
      name: document_id
      required: true
      schema:
        type: string
      style: simple
  /draft-contracts:
    get:
      description: |
        Returns draft contracts with cursor pagination. Draft contracts are staged records that appear in the Rillet UI under
        "Draft" for a human to approve or reject before they become active contracts.
      operationId: list-all-draft-contracts
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/subsidiary_id'
      - description: Optional UUID filter by customer.
        explode: true
        in: query
        name: customer_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_draft_contracts_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all draft contracts
      tags:
      - Draft Contracts
    post:
      description: |
        Stages a contract in the "draft" holding state instead of creating it directly as an active contract.
        Draft contracts appear in the Rillet UI under "Draft" for a human to approve or reject.

        ## Deduplication

        **To prevent duplicate draft contracts on retry, supply at least one `external_references` entry with a
        stable `(type, id)` pair.** When you POST again with any matching `(type, id)` pair, the prior draft record
        is replaced with the new payload.

        Draft contracts created without any `external_references` are not deduplicated — every POST creates a new
        record.

        ## External reference types

        Each reference's `type` must match a slug already defined under Rillet Settings → External References for
        the organization; unknown slugs return a 400. References attached at create time are preserved when the
        draft contract is promoted to an active contract.

        ## Promotion

        Promotion to an active contract happens through the Rillet UI. The public API does not currently expose a
        programmatic promotion endpoint.
      operationId: create-a-draft-contract
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftContractRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftContract'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a draft contract
      tags:
      - Draft Contracts
  /contract-items/{contract_item_id}/usage:
    delete:
      description: |
        Removes the usage entry for a single contract item on a specific calendar date.
        This is narrower than upsert-a-usage-record and is ideal when you need to wipe a mistaken day without resending the entire usage payload.
      operationId: delete-a-usage-record
      parameters:
      - description: UUID of the contract line item whose usage row should be removed.
        explode: false
        in: path
        name: contract_item_id
        required: true
        schema:
          type: string
        style: simple
      - description: Calendar date of the usage row to delete (ISO-8601 format).
        explode: true
        in: query
        name: date
        required: true
        schema:
          format: date
          type: string
        style: form
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a usage record
      tags:
      - Contract Items
    get:
      description: |
        Returns historical usage quantities for a contract item, newest first, with optional pagination cursors.
        Use before upsert-a-usage-record or delete-a-usage-record to understand existing coverage for each date.
      operationId: list-all-contract-item-usage-records
      parameters:
      - description: UUID of the contract line item whose usage rows are being listed.
        explode: false
        in: path
        name: contract_item_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_contract_item_usage_records_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all contract item usage records
      tags:
      - Contract Items
    patch:
      description: Creates usage records on dates where previously no usage was recorded.
        Overwrites usage records on dates where usage was previously recorded already.
      operationId: upsert-a-usage-record
      parameters:
      - description: UUID of the contract line item that carries the usage-priced
          product.
        explode: false
        in: path
        name: contract_item_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageRecords'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRecords'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Upserts a usage record
      tags:
      - Contract Items
  /invoices:
    get:
      description: |
        Returns AR invoices with pagination plus filters for subsidiary, customer, overdue state, and audit timestamps.
        Use invoice ids from this feed with retrieve-an-invoice before performing full updates.
      operationId: list-all-invoices
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/subsidiary_id'
      - description: Filter for overdue invoices.
        explode: true
        in: query
        name: overdue
        required: false
        schema:
          type: boolean
        style: form
      - description: Optional UUID filter by customer.
        explode: true
        in: query
        name: customer_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: |
          Filter invoices by an external reference ID. `external_reference_type` must also be provided.
        explode: true
        in: query
        name: external_reference_id
        required: false
        schema:
          type: string
        style: form
      - description: |
          Filter invoices by an external reference type, such as `Stripe`. `external_reference_id` must also be provided.
        explode: true
        in: query
        name: external_reference_type
        required: false
        schema:
          type: string
        style: form
      - description: Filter invoices updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      - description: Filter invoices by payment status.
        explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/InvoiceStatus'
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_invoices_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all invoices
      tags:
      - Invoices
    post:
      description: |
        A matching creation approval workflow returns HTTP 202 with invoice_id, approval_request_id, and status PENDING.
        This is a proposal, not a created invoice. Retrieve its contents using retrieve-an-invoice-creation-proposal.
        For approval proposals, pass idempotency_key on the initial call and retain it across retries.
        The key is optional; each call without one creates a new submission, including retries.
        The key does not deduplicate legacy creation when approvals are disabled or the invoice belongs to a contract.
        A rejected proposal remains closed; a deliberate new invoice uses a new key.

        Rillet supports two invoice scope types: FULL and REVENUE_RECOGNITION_ONLY. The selected scope determines how the invoice is created and what information the user needs to provide.

        The FULL scope is used when the invoice is generated and sent directly from Rillet. In this case, Rillet automatically assigns the invoice number.

        The REVENUE_RECOGNITION_ONLY scope is intended for situations where the invoice is issued from another system and only needs to be recorded in Rillet for accounting purposes. In this workflow, users must provide the invoice number manually. Other fields can be populated based on the data imported from the external system.

        For example, if your organization issues invoices through an external billing platform but tracks financials in Rillet, you should select REVENUE_RECOGNITION_ONLY. If Rillet handles the entire invoicing and sending process, choose the FULL scope.
      operationId: create-an-invoice
      parameters:
      - description: Stable key for retries of an approval proposal. Ignored when
          approvals are disabled or the invoice belongs to a contract. Use a new key
          for a distinct proposal.
        explode: true
        in: query
        name: idempotency_key
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: Current approval request to replace when deliberately revising
          a held proposal using the same key.
        explode: true
        in: query
        name: replaces_request_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCreationProposal'
          description: "Creation is held for approval. No invoice, accounting, or\
            \ sending has occurred."
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create_an_invoice_409_response'
          description: "The proposal is closed, requires explicit replacement, or\
            \ changed concurrently. Inspect the response before retrying."
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates an invoice
      tags:
      - Invoices
      x-rillet-invoice-creation-response: true
  /invoices/creation-proposals/{invoice_id}:
    get:
      description: |
        Retrieve the captured contents of an invoice awaiting creation approval. No effective invoice exists yet.
        After approval, retrieve the invoice through the normal invoice endpoint. Pending proposals are excluded from invoice lists.
      operationId: retrieve-an-invoice-creation-proposal
      parameters:
      - explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCreationProposal'
          description: Pending invoice creation proposal
        "404":
          description: No accessible pending creation proposal exists
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a pending invoice creation proposal
      tags:
      - Invoices
  /invoices/{invoice_id}:
    delete:
      description: |
        Permanently removes an invoice when your policy allows it (for example draft or voided states).
        Confirm no downstream payments or revenue postings still depend on this invoice.
      operationId: delete-an-invoice
      parameters:
      - description: UUID of the invoice to delete.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes an invoice
      tags:
      - Invoices
    get:
      description: |
        Returns invoice details including line items, tax breakdown, and linkage to contracts or customers.
        Use Accept application/json for structured data; application/pdf is only for human-readable exports when enabled.
      operationId: retrieve-an-invoice
      parameters:
      - description: UUID of the invoice to retrieve.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      - description: Response format preference; default is application/json.
        explode: false
        in: header
        name: Accept
        required: false
        schema:
          default: application/json
          enum:
          - application/json
          - application/pdf
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
            application/pdf:
              schema:
                format: binary
                type: string
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves an invoice
      tags:
      - Invoices
    put:
      description: |
        IMPORTANT: This is a full-replace operation (PUT semantics). All fields must be
        included in the request body — omitting any field will set it to null, wiping
        existing data. Always call retrieve-an-invoice first to fetch the current record,
        then include ALL existing fields in your update request along with your changes.
        Exceptions that keep stored data when the field is omitted:
        - metadata: omit it to keep all existing metadata, or send only the keys you want to set or clear.
        - shipping_customer_id, billing_address_id, shipping_address_id: omit them to keep the invoice's current
          ship-to customer and addresses, or send null to clear them. This is for backward compatibility:
          integrations built before these fields existed won't clear them on every update.
        - email_selection: omit it to keep the invoice's current recipients.
      operationId: update-an-invoice
      parameters:
      - description: UUID of the invoice to be used in this operation.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceUpdateProposal'
          description: Invoice edits are awaiting approval; the existing invoice remains
            effective.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates an invoice
      tags:
      - Invoices
      x-rillet-invoice-update-response: true
  /invoices/{invoice_id}/taxes:
    post:
      description: |
        Recalculates or replaces tax lines on an existing invoice using the supplied tax payload.
        Use after changing taxable addresses or when integrating an external tax engine result.
        Returns `400` when the supplied taxes would turn an invoice total that is zero or positive into a negative
        total. Invoices whose total is already negative can still be updated.
      operationId: update-taxes-for-an-invoice
      parameters:
      - description: UUID of the invoice whose taxes should be recomputed.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaxesRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceUpdateResponse'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceUpdateProposal'
          description: Tax changes are held for approval; effective invoice amounts
            are unchanged.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates invoice taxes
      tags:
      - Invoices
  /invoice-payments:
    get:
      description: |
        Pages every customer payment recorded against invoices across the organization, independent of which invoice it settled.
        Use updated.gt and sort_by when syncing integrations; follow the pagination cursor until no next page remains.
      operationId: list-all-invoices-payments
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - description: Filter payments updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      - description: the field the payments should be sorted by descending (either
          created or updated)
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: created
          enum:
          - created
          - updated
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_invoices_payments_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all invoice payments
      tags:
      - Invoice payments
  /invoices/{invoice_id}/payments:
    get:
      description: |
        Returns every payment attempt tied to a single invoice, including successful, uncleared, and failed rows with their public status.
        Pair with retrieve-an-invoice when reconciling an account statement against what Rillet already applied.
      operationId: list-all-invoice-payments
      parameters:
      - description: UUID of the invoice to be used in this operation.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_invoice_payments_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists payments for a given invoice
      tags:
      - Invoice payments
    post:
      description: |
        Records a manual cash receipt against an open invoice by amount, effective date, and a GL account code that maps to a funded cash account.
        Rillet resolves the account code to a cash account before posting, so verify chart-of-accounts mapping when automations fail validation.
      operationId: create-an-invoice-payment
      parameters:
      - description: UUID of the invoice to be used in this operation.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePaymentRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePayment'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates an invoice payment
      tags:
      - Invoice payments
  /invoices/{invoice_id}/payments/{payment_id}:
    delete:
      description: |
        Reverses a previously recorded uncleared invoice payment, restoring the invoice balance accordingly.
        Only uncleared payments can be deleted; cleared or reconciled payments are rejected.
        Treat this as a corrective action with the same controls you apply to voiding treasury transactions in your close process.
      operationId: delete-an-invoice-payment
      parameters:
      - description: UUID of the invoice to be used in this operation.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: UUID of the payment to be used in this operation.
        explode: false
        in: path
        name: payment_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes an invoice payment
      tags:
      - Invoice payments
    put:
      description: |
        Replaces the amount, date, and cash account on an existing uncleared invoice payment.
        Only uncleared payments can be updated; cleared or reconciled payments are rejected.
        This is a full-replace operation (PUT semantics) — include all fields in the request body.
      operationId: update-an-invoice-payment
      parameters:
      - description: UUID of the invoice to be used in this operation.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: UUID of the payment to be used in this operation.
        explode: false
        in: path
        name: payment_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePaymentRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePayment'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates an invoice payment
      tags:
      - Invoice payments
  /invoices/{invoice_id}/sent-status:
    put:
      description: |
        Marks whether an invoice has been delivered to the customer, which downstream workflows use for collections cadence and compliance reporting.
        Set the sent flag true after your billing system or email provider confirms delivery, or false while the document is still internal-only.
      operationId: update-invoice-sent-status
      parameters:
      - description: UUID of the invoice to be used in this operation.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceSentStatusRequest'
        required: true
      responses:
        "200":
          description: OK
        "409":
          description: "An invoice edit awaits approval, or its review changed concurrently.\
            \ Resolve the review before marking the invoice as sent."
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates invoice sent status
      tags:
      - Invoices
  /invoices/{invoice_id}/documents:
    get:
      description: |
        Returns all attached documents, including those uploaded through the Rillet application.
        Each download URL is valid for up to 1 hour; call this endpoint again to obtain fresh URLs.
        Documents are listed oldest first.
        Returns an empty `documents` array when the invoice has no attachments.
      operationId: list-invoice-documents
      parameters:
      - description: UUID of the invoice to be used in this operation.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_invoice_documents_200_response'
          description: Attached documents
        "400":
          description: Malformed invoice id
        "404":
          description: Invoice not found or not accessible
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists documents attached to an invoice
      tags:
      - Invoice Documents
    parameters:
    - description: UUID of the invoice to be used in this operation.
      explode: false
      in: path
      name: invoice_id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: |
        Attaches one PDF, JPEG, PNG, or XLSX file to an existing invoice.
        Existing attachments are preserved, including files uploaded through the Rillet application.
        Repeating an upload creates a new file; there is no idempotency key.
        When Update approval is required, returns 202 with a review reference and the file is not
        attached until approval. A different upload while an edit is pending returns 409.
        Cancel or resolve a pending approval before uploading another file.
        An invoice can have at most 10 attachments totalling at most 7 MiB, including files uploaded
        through the Rillet application, so the invoice email stays within delivery limits.
        A file name may have at most 255 characters and must not contain a path.
        Attachments are included when Rillet emails the invoice. Attach before the invoice is sent:
        adding a file to an invoice that was already sent does not send it again.
      operationId: upload-invoice-document
      parameters:
      - description: UUID of the invoice to be used in this operation.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: "application/pdf, image/jpeg, image/png, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                style: form
            schema:
              $ref: '#/components/schemas/upload_contract_document_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upload_invoice_document_200_response'
          description: Document attached
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceUpdateProposal'
          description: Attachment addition awaiting approval; effective attachments
            are unchanged
        "400":
          description: "Empty file, missing filename, unsupported file content, or\
            \ attachment limit reached"
        "404":
          description: Invoice not found or not accessible
        "409":
          description: |
            An invoice edit is awaiting approval, or other uploads kept changing the invoice's attachments; retry the upload.
            Or the size of an existing attachment cannot be read; the error names it so it can be removed or re-uploaded.
        "413":
          description: The invoice's attachments would exceed 7 MiB in total
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Uploads a document to an invoice
      tags:
      - Invoice Documents
  /invoices/{invoice_id}/documents/{document_id}:
    delete:
      description: |
        Removes one attachment from an invoice and deletes the stored file.
        When Update approval is required, returns 202 with a review reference. The attachment
        remains effective until approval. Stored files referenced by review history are retained.
        Works for files uploaded through the API or the Rillet application.
        Removing a file from an invoice that was already sent does not change the email that went out.
      operationId: delete-an-invoice-document
      parameters:
      - description: UUID of the invoice to be used in this operation.
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      - description: The id returned by the upload or list endpoint.
        explode: false
        in: path
        name: document_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceUpdateProposal'
          description: Attachment removal awaiting approval; the attachment remains
            effective
        "204":
          description: Document removed
        "400":
          description: Malformed invoice or document id
        "404":
          description: "Invoice not found or not accessible, or the document is not\
            \ attached to this invoice"
        "409":
          description: An invoice edit is awaiting approval or the invoice changed
            concurrently
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a document from an invoice
      tags:
      - Invoice Documents
    parameters:
    - description: UUID of the invoice to be used in this operation.
      explode: false
      in: path
      name: invoice_id
      required: true
      schema:
        type: string
      style: simple
    - description: The id returned by the upload or list endpoint.
      explode: false
      in: path
      name: document_id
      required: true
      schema:
        type: string
      style: simple
  /customers/{customer_id}/metadata:
    get:
      description: |
        Returns this customer's metadata values keyed by definition key. Keys with no value are
        omitted, including values held by archived definitions, which stay readable here.
        Definition names, types and status come from list-all-metadata-definitions.
      operationId: retrieve-customer-metadata
      parameters:
      - description: UUID of the customer to retrieve metadata for.
        explode: false
        in: path
        name: customer_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValues'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves customer metadata
      tags:
      - Customers
    patch:
      description: |
        Partial update. Keys omitted from the request body are left unchanged; send a key with a
        null, empty, or whitespace-only value to clear it. Prefer this over
        update-customer-metadata when setting or clearing individual keys, as it cannot disturb
        keys you did not name. Archived keys may only be cleared, never changed. Every key must
        name a definition assigned to customers: an unknown key, or one assigned only to another
        entity type, fails the request with a 400. Keys are never silently ignored. The write is
        atomic: if any key fails validation, nothing is written.
      operationId: patch-customer-metadata
      parameters:
      - description: UUID of the customer to patch metadata for.
        explode: false
        in: path
        name: customer_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMetadataValuesRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValues'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Patches customer metadata
      tags:
      - Customers
    put:
      description: |
        Full replacement: every active key omitted from the request is cleared. To set or clear
        individual keys without disturbing the rest, use patch-customer-metadata instead. Null,
        empty, and whitespace-only values clear one key. Unknown keys, archived keys, and
        definitions not assigned to customers fail the entire request with a 400.
        Metadata-only changes are recorded in the audit log but do not trigger customer.updated
        webhooks or customer integration syncs.
      operationId: update-customer-metadata
      parameters:
      - description: UUID of the customer to update metadata for.
        explode: false
        in: path
        name: customer_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataValuesRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValues'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates customer metadata
      tags:
      - Customers
  /customers/metadata/bulk:
    post:
      description: |
        Patches metadata on up to 1,000 customers in one atomic request. Each customer may receive
        different values. If a customer is missing or any key or value is invalid, nothing is
        written for any customer. Per customer this behaves exactly like patch-customer-metadata:
        keys omitted for that customer are left unchanged; null, empty, and whitespace-only values
        clear that key.
        Metadata-only changes are recorded in the audit log but do not trigger customer.updated
        webhooks or customer integration syncs.
      operationId: bulk-update-customer-metadata
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateCustomerMetadataRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateCustomerMetadataResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates metadata for multiple customers
      tags:
      - Customers
