  /bank-accounts:
    get:
      description: |
        Returns cash bank accounts configured for the organization, optionally filtered by subsidiary.
        Bank account ids anchor transaction import, reconciliation, and treasury automations.
      operationId: list-all-bank-accounts
      parameters:
      - $ref: '#/components/parameters/subsidiary_id'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_bank_accounts_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all bank accounts
      tags:
      - Bank accounts
    post:
      description: |
        Registers a treasury bank account with currency, institution identifiers, and linkage to the GL cash account used during transaction import.
        Accurate mapping here ensures invoice payments, bill payments, and bank feeds all post to the same cash subledger.
      operationId: create-a-bank-account
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBankAccountRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a bank account
      tags:
      - Bank accounts
  /bank-accounts/{bank_account_id}:
    delete:
      description: |
        Removes a bank account definition when the entity closed the account or you mistakenly created a duplicate connector mapping.
        Ensure no scheduled payments or open reconciliation batches still target this bank account before deletion.
      operationId: delete-a-bank-account
      parameters:
      - description: UUID of the bank account to be used in this operation.
        explode: false
        in: path
        name: bank_account_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a bank account
      tags:
      - Bank accounts
    get:
      description: |
        Returns configuration and status for a single bank account, including identifiers downstream connectors need when refreshing balances.
        Use before deleting or updating metadata so you preserve institution codes and default subsidiary routing.
      operationId: retrieve-a-bank-account
      parameters:
      - description: UUID of the bank account to be used in this operation.
        explode: false
        in: path
        name: bank_account_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a bank account
      tags:
      - Bank accounts
  /bank-transactions:
    get:
      description: |
        Streams imported or manually entered cash activity for reconciliation, optionally scoped by bank account, subsidiary, or updated-since filters.
        Pair results with retrieve-a-bank-transaction when you need memo-level detail before marking items cleared.
      operationId: list-all-bank-transactions
      parameters:
      - description: Filter by bank account
        explode: true
        in: query
        name: bank_account_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - $ref: '#/components/parameters/subsidiary_id'
      - description: Filter bank transactions updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      - description: Filter bank transactions with date on or after this date
        explode: true
        in: query
        name: date.gte
        required: false
        schema:
          example: 2023-01-01
          format: date
          type: string
        style: form
      - description: Filter bank transactions with date on or before this date
        explode: true
        in: query
        name: date.lte
        required: false
        schema:
          example: 2023-12-31
          format: date
          type: string
        style: form
      - description: Field to sort results by (see enum values).
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          enum:
          - created
          - updated
          type: string
        style: form
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_bank_transactions_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all bank transactions
      tags:
      - Bank Transactions
    post:
      description: |
        Inserts a single bank feed line such as a wire, ACH, or adjustment when automated imports miss a statement row.
        Specify the hosting bank account and value dates so cash reporting matches what treasury already booked externally.
      operationId: create-a-bank-transaction
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBankTransactionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a bank transaction
      tags:
      - Bank Transactions
  /bank-transactions/{bank_transaction_id}:
    delete:
      description: |
        Removes a bank transaction row that was imported twice or created in error before it affects reconciled cash balances.
        Confirm treasury agrees the underlying bank activity will not return on the next feed pull before deleting.
      operationId: delete-a-bank-transaction
      parameters:
      - description: UUID of the bank transaction to be used in this operation.
        explode: false
        in: path
        name: bank_transaction_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a bank transaction
      tags:
      - Bank Transactions
    get:
      description: |
        Fetches one bank transaction with counterparty text, amounts, and reconciliation flags used by cash teams during month-end.
        Use before update-a-bank-transaction to preserve memos or matched invoice references embedded in the payload.
      operationId: retrieve-a-bank-transaction
      parameters:
      - description: UUID of the bank transaction to be used in this operation.
        explode: false
        in: path
        name: bank_transaction_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a bank transaction
      tags:
      - Bank Transactions
    put:
      description: |
        Adjusts memo, categorization, or reconciliation metadata on an existing bank transaction without re-importing the entire feed batch.
        Supply the full body expected by the schema so optional fields you intend to keep are not unintentionally cleared.
      operationId: update-a-bank-transaction
      parameters:
      - description: UUID of the bank transaction to be used in this operation.
        explode: false
        in: path
        name: bank_transaction_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBankTransactionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates a bank transaction
      tags:
      - Bank Transactions
  /tax-rates:
