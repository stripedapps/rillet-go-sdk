    CountryCode:
      description: Two-letter country code (ISO 3166-1 alpha-2).
      example: US
      type: string
    RevenuePattern:
      description: DAILY means that the revenue is divided equally per day in the
        revenue period. EVEN_PERIOD means that the revenue is divided equally for
        each calendar month in the revenue period.
      enum:
      - DAILY
      - EVEN_PERIOD
      type: string
    FixedPrice:
      properties:
        amount:
          $ref: '#/components/schemas/MonetaryAmount'
      required:
      - amount
    RecurringPrice:
      properties:
        interval_months:
          example: 1
          format: int32
          maximum: 12
          minimum: 1
          type: integer
      required:
      - interval_months
    Price:
      discriminator:
        mapping:
          FIXED_RECURRING: '#/components/schemas/FixedRecurringPrice'
          ONE_TIME: '#/components/schemas/OneTimePrice'
          USAGE: '#/components/schemas/UsagePrice'
        propertyName: type
      example:
        type: FIXED_RECURRING
        amount:
          amount: "10.00"
          currency: USD
        interval_months: 1
      oneOf:
      - $ref: '#/components/schemas/FixedRecurringPrice'
      - $ref: '#/components/schemas/OneTimePrice'
      - $ref: '#/components/schemas/UsagePrice'
    FixedRecurringPrice:
      allOf:
      - $ref: '#/components/schemas/FixedPrice'
      - $ref: '#/components/schemas/RecurringPrice'
      - properties:
          type:
            default: FIXED_RECURRING
            type: string
        required:
        - type
    OneTimePrice:
      allOf:
      - $ref: '#/components/schemas/FixedPrice'
      - properties:
          type:
            default: ONE_TIME
            type: string
        required:
        - type
    UsagePrice:
      allOf:
      - $ref: '#/components/schemas/RecurringPrice'
      - properties:
          type:
            default: USAGE
            type: string
          billing_scheme:
            $ref: '#/components/schemas/BillingScheme'
        required:
        - billing_scheme
        - type
    BillingScheme:
      discriminator:
        mapping:
          PER_UNIT: '#/components/schemas/PerUnitBilling'
          TIERED: '#/components/schemas/TieredBilling'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/PerUnitBilling'
      - $ref: '#/components/schemas/TieredBilling'
    PerUnitBilling:
      properties:
        type:
          default: PER_UNIT
          type: string
        amount:
          $ref: '#/components/schemas/MonetaryAmount'
        units:
          example: 1
          format: int32
          minimum: 1
          type: integer
      required:
      - amount
      - type
      - units
    TieredBilling:
      description: All tiers except for the highest have to define a value for upTo.
        There cannot be more than one tier with the same upTo value.
      properties:
        type:
          default: TIERED
          type: string
        mode:
          description: "In metered tiering, the maximum quantity within a period determines\
            \ the price. In graduated tiering, pricing changes as the quantity grows\
            \ – the price from each tier up to the reported quantity is accumulated."
          enum:
          - GRADUATED
          - METERED
          type: string
        tiers:
          items:
            $ref: '#/components/schemas/Tier'
          minItems: 1
          type: array
      required:
      - mode
      - tiers
      - type
    Tier:
      description: At least one of flatPrice or perUnitPrice has to be defined. flatPrice
        is the price for the entire tier. perUnitPrice is price for units relevant
        to the tier.
      properties:
        up_to:
          example: 10
          format: int32
          minimum: 1
          type: integer
        flat_price:
          $ref: '#/components/schemas/MonetaryAmount'
        per_unit_price:
          $ref: '#/components/schemas/MonetaryAmount'
      required:
      - up_to
