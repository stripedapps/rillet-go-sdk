          allOf:
          - $ref: '#/components/schemas/EmailSelection'
          description: "Who receives the invoices of the contract created from this\
            \ draft. If omitted, none is specified and the reviewer starts from all\
            \ of the billing customer's emails. On update, omit to keep the current\
            \ selection, or send ALL_CUSTOMER_EMAILS to follow the customer's emails.\
            \ A draft keeps one entry per email, the first one sent. With SELECTED_EMAILS\
            \ and no MAIN_SENDER recipient left, including an empty recipients list,\
            \ no selection is stored, the same as the review page. A stored recipient\
            \ that is not one of the billing customer's emails is rejected."
