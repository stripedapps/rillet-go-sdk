            requiring every approver is not something the Rillet app can configure yet.
          example: false
          type: boolean
        role_ids:
          description: |
            Roles allowed to approve at this layer.
          items:
            example: 7a1b2c3d-4e5f-6789-abcd-ef0123456789
            format: uuid
            type: string
          minItems: 1
          type: array
      required:
