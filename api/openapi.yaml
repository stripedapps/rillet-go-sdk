            example: 0199e21e-3b5a-7222-9d33-bbccddeeff00
            format: uuid
            type: string
          minItems: 1
          type: array
      required:
      - account_ids
      - condition_type
      - operator
    ApprovalWorkflowSourceTypeCondition:
      description: |
        Matches on how the entry came to exist. A journal-entry workflow with no condition of this type applies
        to manually created entries only. A workflow can carry at most one.
      properties:
        id:
          description: |
            Identifies the condition. Server-generated, and returned on every read.
          example: 0199e21b-be83-7298-a9d6-8c43437117c8
          format: uuid
          type: string
        condition_type:
          default: SOURCE_TYPE
          type: string
        source_type:
          $ref: '#/components/schemas/ApprovalWorkflowSourceType'
      required:
      - condition_type
      - id
      - source_type
    ApprovalWorkflowSourceTypeConditionRequest:
      description: |
        Matches on how the entry came to exist. A journal-entry workflow with no condition of this type applies
        to manually created entries only. A workflow can carry at most one.
      properties:
        id:
          description: |
            Send the id of an existing condition to keep it, or omit it to have a new one generated.
          example: 0199e21b-be83-7298-a9d6-8c43437117c8
          format: uuid
          type: string
        condition_type:
          default: SOURCE_TYPE
          type: string
        source_type:
          $ref: '#/components/schemas/ApprovalWorkflowSourceType'
      required:
      - condition_type
      - source_type
    ApprovalWorkflowLayer:
      description: |
        One layer of approvers. `approver_type` selects the variant.
      discriminator:
        mapping:
          USER: '#/components/schemas/ApprovalWorkflowUserLayer'
          ROLE: '#/components/schemas/ApprovalWorkflowRoleLayer'
        propertyName: approver_type
      example:
        id: 0199e21e-3b5a-7222-9d33-bbccddeeff00
        order: 1
        approver_type: USER
        require_all: false
        approver_user_ids:
        - 0199e21a-9b3d-7cde-8f21-665544332211
      oneOf:
      - $ref: '#/components/schemas/ApprovalWorkflowUserLayer'
      - $ref: '#/components/schemas/ApprovalWorkflowRoleLayer'
    ApprovalWorkflowUserLayer:
      description: |
        A layer approved by the named users.
      properties:
        id:
          description: |
            Identifies the layer. Server-generated, and returned on every read.
          example: 0199e21e-3b5a-7222-9d33-bbccddeeff00
          format: uuid
          type: string
        order:
          description: |
            Position of the layer in the sequence, starting at 1. Layers are numbered consecutively with no gaps
            or repeats.
          example: 1
          format: int32
          minimum: 1
          type: integer
        approver_type:
          default: USER
          type: string
        require_all:
          description: |
            When true, every listed user must approve; when false, one approval satisfies the layer. Workflows
            configured in the Rillet app always use false.
          example: false
          type: boolean
        approver_user_ids:
          description: |
            Users allowed to approve at this layer. Each must be an active member of the organization.
          items:
            example: 0199e21a-9b3d-7cde-8f21-665544332211
            format: uuid
            type: string
          minItems: 1
          type: array
      required:
      - approver_type
      - approver_user_ids
      - id
      - order
      - require_all
    ApprovalWorkflowRoleLayer:
      description: |
        A layer approved by anyone holding one of the given roles. Membership is resolved when the approval
        happens, not when the workflow is saved, so changing who holds a role changes who can approve entries
        already awaiting approval.
      properties:
        id:
          description: |
            Identifies the layer. Server-generated, and returned on every read.
          example: 0199e21f-4c6b-7333-ae44-ccddeeff0011
          format: uuid
          type: string
        order:
          description: |
            Position of the layer in the sequence, starting at 1. Layers are numbered consecutively with no gaps
            or repeats.
          example: 2
          format: int32
          minimum: 1
          type: integer
        approver_type:
          default: ROLE
          type: string
        require_all:
          description: |
            When true, each listed role must be represented among the approvals; when false, one approval
            satisfies the layer. Workflows configured in the Rillet app always use false.
          example: false
          type: boolean
        role_ids:
          description: |
            Roles allowed to approve at this layer.
          items:
            example: 7a1b2c3d-4e5f-6789-abcd-ef0123456789
            format: uuid
            type: string
          minItems: 1
          type: array
      required:
      - approver_type
      - id
      - order
      - require_all
      - role_ids
    ApprovalWorkflowConditionGroupRequest:
      description: |
        A set of conditions combined by one logical operator, together with any nested groups. A group must
        carry at least one condition or one nested group; a workflow may carry at most five conditions across
        the whole tree, and nesting at most three levels deep. `groups` must be empty for now: nested
        combinations are not evaluated yet and are rejected, so a workflow currently has exactly one group.
      example:
        groups:
        - null
        - null
        logic: AND
        conditions:
        - condition_type: AMOUNT
          operator: GREATER_THAN
          threshold:
            type: MONETARY
            amount:
              amount: "50000.00"
              currency: USD
        - condition_type: AMOUNT
          operator: GREATER_THAN
          threshold:
            type: MONETARY
            amount:
              amount: "50000.00"
              currency: USD
      properties:
        logic:
          $ref: '#/components/schemas/ApprovalWorkflowConditionLogic'
        conditions:
          items:
            $ref: '#/components/schemas/ApprovalWorkflowConditionRequest'
          type: array
        groups:
          description: |
            Nested groups. Rejected while nesting is unsupported.
          items:
            $ref: '#/components/schemas/ApprovalWorkflowConditionGroupRequest'
          type: array
      required:
      - conditions
      - logic
    ApprovalWorkflowConditionRequest:
      description: |
        One condition to write. `condition_type` selects the variant.
      discriminator:
        mapping:
          AMOUNT: '#/components/schemas/ApprovalWorkflowAmountConditionRequest'
          SUBSIDIARY: '#/components/schemas/ApprovalWorkflowSubsidiaryConditionRequest'
          CREATED_BY_USER: '#/components/schemas/ApprovalWorkflowCreatedByUserConditionRequest'
          AURA_ASSISTED: '#/components/schemas/ApprovalWorkflowAuraAssistedConditionRequest'
          UI_SUBMITTED: '#/components/schemas/ApprovalWorkflowUiSubmittedConditionRequest'
          API_SUBMITTED: '#/components/schemas/ApprovalWorkflowApiSubmittedConditionRequest'
          MCP_SUBMITTED: '#/components/schemas/ApprovalWorkflowMcpSubmittedConditionRequest'
          FIELD: '#/components/schemas/ApprovalWorkflowFieldConditionRequest'
          ACCOUNT: '#/components/schemas/ApprovalWorkflowAccountConditionRequest'
          SOURCE_TYPE: '#/components/schemas/ApprovalWorkflowSourceTypeConditionRequest'
          VENDOR: '#/components/schemas/ApprovalWorkflowVendorConditionRequest'
          PROVIDER: '#/components/schemas/ApprovalWorkflowProviderConditionRequest'
          OPERATION: '#/components/schemas/ApprovalWorkflowOperationConditionRequest'
        propertyName: condition_type
      example:
        condition_type: AMOUNT
        operator: GREATER_THAN
        threshold:
          type: MONETARY
          amount:
            amount: "50000.00"
            currency: USD
      oneOf:
      - $ref: '#/components/schemas/ApprovalWorkflowAmountConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowSubsidiaryConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowCreatedByUserConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowAuraAssistedConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowUiSubmittedConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowApiSubmittedConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowMcpSubmittedConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowFieldConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowAccountConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowSourceTypeConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowVendorConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowProviderConditionRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowOperationConditionRequest'
    ApprovalWorkflowLayerRequest:
      description: |
        One layer of approvers to write. `approver_type` selects the variant.
      discriminator:
        mapping:
          USER: '#/components/schemas/ApprovalWorkflowUserLayerRequest'
          ROLE: '#/components/schemas/ApprovalWorkflowRoleLayerRequest'
        propertyName: approver_type
      example:
        order: 1
        approver_type: USER
        require_all: false
        approver_user_ids:
        - 0199e21a-9b3d-7cde-8f21-665544332211
      oneOf:
      - $ref: '#/components/schemas/ApprovalWorkflowUserLayerRequest'
      - $ref: '#/components/schemas/ApprovalWorkflowRoleLayerRequest'
    ApprovalWorkflowUserLayerRequest:
      description: |
        A layer approved by the named users.
      properties:
        id:
          description: |
            Send the id of an existing layer to keep it, or omit it to have a new one generated.
          example: 0199e21e-3b5a-7222-9d33-bbccddeeff00
          format: uuid
          type: string
        order:
          description: |
            Position of the layer in the sequence. Layers must be numbered consecutively from 1, with no gaps or
            repeats.
          example: 1
          format: int32
          minimum: 1
          type: integer
        approver_type:
          default: USER
          type: string
        require_all:
          description: |
            Whether every listed user must approve. Only `false` is accepted today — requiring every approver
            is not something the Rillet app can configure yet.
          example: false
          type: boolean
        approver_user_ids:
          description: |
            Users allowed to approve at this layer. Each must be an active member of the organization.
          items:
            example: 0199e21a-9b3d-7cde-8f21-665544332211
            format: uuid
            type: string
          minItems: 1
          type: array
      required:
      - approver_type
