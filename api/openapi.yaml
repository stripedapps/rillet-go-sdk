        - order: 1
          approver_type: USER
          require_all: false
          approver_user_ids:
          - 0199e21a-9b3d-7cde-8f21-665544332211
        type: JOURNAL_ENTRY
        submission_sources: ""
      properties:
        name:
          example: JE over 50k — Controller then CFO
          type: string
        type:
          $ref: '#/components/schemas/ApprovalWorkflowType'
        active:
          description: |
            Required, and must equal the workflow's current value — activation is a dedicated operation in
            Rillet, so a definition update never changes it. Read the workflow first if you are unsure.
          type: boolean
        condition_group:
          $ref: '#/components/schemas/ApprovalWorkflowConditionGroupRequest'
        approval_layers:
          items:
            $ref: '#/components/schemas/ApprovalWorkflowLayerRequest'
          maxItems: 5
          minItems: 1
          type: array
        methods:
          description: |
            Only `["IN_APP"]` is accepted today: `EMAIL` and `SLACK` deliver nothing, so they are rejected
            rather than stored.
          items:
            $ref: '#/components/schemas/ApprovalWorkflowMethod'
          minItems: 1
          type: array
        submission_sources:
