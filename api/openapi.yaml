        - parent_customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - parent_customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - parent_customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        root_parent_customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: Acme Holdings
      properties:
        name:
          description: Defaults to the root parent customer's name when omitted.
          example: Acme Holdings
          type: string
        root_parent_customer_id:
          description: The customer at the top of the tree. It must not already belong
            to a family.
          format: uuid
          type: string
        child_links:
          description: |
            Every other member, and who it reports to. Each one reports to the root parent or to
            another customer in this list, which is how a hierarchy deeper than one level is created
            in a single call.
          items:
            $ref: '#/components/schemas/CustomerFamilyLink'
          maxItems: 1000
          minItems: 1
          type: array
      required:
      - child_links
      - root_parent_customer_id
    AddCustomerFamilyMembersRequest:
      example:
        members:
        - parent_customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
