            EXPENSE: `Cost of Goods Sold`, `Operating Expense`, `Operating Expense - Personnel`,
            `Operating Expense - Office Expenses`, `Operating Expense - Sales & Marketing`,
            `Operating Expense - Commissions`, `Operating Expense - Research & Development`,
            `Non Operating Expense`, `Non Operating Income`.

            INCOME: `Revenue`.
          enum:
