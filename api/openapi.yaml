  /reports/journal-entries:
    get:
      description: Returns journal entries with line item amounts converted to the
        reporting currency.
      operationId: list-reports-journal-entries
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/subsidiary_id'
      - description: Filter journal entries updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      - description: Filter journal entries with a posting date on or after this date
          (inclusive)
        explode: true
        in: query
        name: date.gte
        required: false
        schema:
          example: 2023-12-01
          format: date
          type: string
        style: form
      - description: Filter journal entries with a posting date on or before this
          date (inclusive)
        explode: true
        in: query
        name: date.lte
        required: false
        schema:
          example: 2023-12-31
          format: date
          type: string
        style: form
      - description: the field the journal entries should be sorted by descending
          (either created or updated)
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: created
          enum:
          - created
          - updated
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_reports_journal_entries_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists journal entries with reporting currency amounts
      tags:
      - Reports
components:
  parameters:
    limit:
      description: Maximum number of rows to return in the page.
      explode: true
      in: query
      name: limit
      required: false
      schema:
        $ref: '#/components/schemas/PageLimit'
      style: form
    cursor:
      description: Pagination cursor to navigate through the full response.
      explode: true
      in: query
      name: cursor
      required: false
      schema:
        $ref: '#/components/schemas/PageCursor'
      style: form
    status:
      description: whether to include committed or active entries
      explode: true
      in: query
      name: status
      required: true
      schema:
        $ref: '#/components/schemas/Status'
      style: form
    breakdown:
      description: whether annual or monthly breakdowns
      explode: true
      in: query
      name: breakdown
      required: true
      schema:
        $ref: '#/components/schemas/Breakdown'
      style: form
    subsidiaryId:
      deprecated: true
      description: "Deprecated: use subsidiary_id instead. Subsidiary to be used when\
        \ filtering data."
      explode: true
      in: query
      name: subsidiaryId
      required: false
      schema:
        format: uuid
        type: string
      style: form
    subsidiary_id:
      description: Subsidiary to be used when filtering data
      explode: true
      in: query
      name: subsidiary_id
      required: false
      schema:
        format: uuid
        type: string
      style: form
    month:
      description: The month and year to export. Uses ISO-8061 format (YYYY-MM).
      explode: true
      in: query
      name: month
      required: true
      schema:
        format: yearMonth
        type: string
      style: form
    fromDate:
      description: Start date for the report period. Uses ISO-8601 format (YYYY-MM-DD).
      example: 2024-01-01
      explode: true
      in: query
      name: from_date
      required: true
      schema:
        format: date
        type: string
      style: form
    toDate:
      description: End date for the report period. Uses ISO-8601 format (YYYY-MM-DD).
      example: 2024-01-31
      explode: true
      in: query
      name: to_date
      required: true
      schema:
        format: date
        type: string
      style: form
    asOfDate:
      description: The date for the point-in-time report. Uses ISO-8601 format (YYYY-MM-DD).
      example: 2024-01-31
      explode: true
      in: query
      name: as_of_date
      required: true
      schema:
        format: date
        type: string
      style: form
    breakdownBy:
      description: "How to break down the report columns. If not specified, returns\
        \ a single total column."
      explode: true
      in: query
      name: breakdown_by
      required: false
      schema:
        $ref: '#/components/schemas/ReportBreakdownBy'
      style: form
    customFieldId:
      description: The ID of the custom field to break down by. Required when breakdown_by
        is CUSTOM_FIELD.
      explode: true
      in: query
      name: custom_field_id
      required: false
      schema:
        format: uuid
        type: string
      style: form
    X-Rillet-Signature:
      description: Signature of the webhook event. Computed using HMAC-SHA256 and
        AES encrypted with the configured webhook token. The contents of the body
        are prefixed with the timestamp and id before hashing.
      explode: false
      in: header
      name: X-Rillet-Signature
      required: true
      schema:
        type: string
      style: simple
    X-Rillet-Timestamp:
      description: Timestamp of the webhook event in ISO-8601 format
      explode: false
      in: header
      name: X-Rillet-Timestamp
      required: true
      schema:
        format: date-time
      style: simple
    X-Rillet-Id:
      description: ID of the webhook event
      explode: false
      in: header
      name: X-Rillet-Id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    X-Rillet-Entity:
      description: Entity type of the webhook event
      explode: false
      in: header
      name: X-Rillet-Entity
      required: true
      schema:
        type: string
      style: simple
    X-Rillet-Event:
      description: Event type of the webhook event
      explode: false
      in: header
      name: X-Rillet-Event
      required: true
      schema:
        type: string
      style: simple
