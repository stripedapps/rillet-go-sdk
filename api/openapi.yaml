    Pagination:
      example:
        next_cursor: iLQvkEj3sh3UiweC
      properties:
        next_cursor:
          description: "If defined, a cursor to retrieve the next page."
          example: iLQvkEj3sh3UiweC
          type: string
    PageCursor:
      description: "If defined, a cursor to retrieve the next page."
      example: iLQvkEj3sh3UiweC
      type: string
    PageLimit:
      default: 25
      maximum: 100
      minimum: 1
      type: integer
    CountryCode:
      description: Two-letter country code (ISO 3166-1 alpha-2).
      example: US
      type: string
    RevenuePattern:
      description: DAILY divides revenue equally per day. EVEN_PERIOD divides revenue
        equally per calendar month. PROGRESS uses a progress plan; the supported measure
        MILESTONES recognizes allocated revenue on milestone completion and requires
        a one-time price. FULL contract creation supports an explicit progress plan
        or snapshots the referenced product's template. Existing non-progress behavior
        is unchanged.
      enum:
      - DAILY
      - EVEN_PERIOD
      - PROGRESS
      type: string
    ProgressMeasure:
      description: The progress measure. Only MILESTONES is currently supported.
      enum:
      - MILESTONES
      type: string
    ProgressPlanTemplateRequest:
      $ref: '#/components/schemas/MilestonePlanTemplateRequest'
    ProgressPlanTemplate:
      $ref: '#/components/schemas/MilestonePlanTemplate'
    MilestoneValueMode:
      description: "Values are non-negative plain decimal strings with no exponent\
        \ notation. PERCENTAGE supports at most 4 decimal places; AMOUNT supports\
        \ at most 10 decimal places. Excess decimal places, including trailing zeros,\
        \ are rejected rather than rounded. PERCENTAGE values are whole percentages\
        \ (\"30\" means 30%), range from 0 to 100, and must total exactly 100. AMOUNT\
        \ values on product templates are proportional weights in the product's currency\
        \ and must total more than zero; they are not fixed contract obligations."
      enum:
      - PERCENTAGE
      - AMOUNT
      type: string
    MilestoneExpectedOffset:
      description: "Forecast offset from the contract line start date, not an invoicing\
        \ or recognition trigger. Uses a non-negative integer count and a single calendar\
        \ unit. Zero offsets are returned as {\"count\": 0, \"unit\": \"DAYS\"}."
      properties:
        count:
          example: 1
          format: int32
          minimum: 0
          type: integer
        unit:
          enum:
          - DAYS
          - MONTHS
          - YEARS
          example: MONTHS
          type: string
      required:
      - count
      - unit
    MilestoneTemplateRequest:
      properties:
        key:
          description: "Stable integration identifier, unique within the plan ignoring\
            \ case. Keys that parse as UUIDs are not allowed."
          example: design-approved
          pattern: "^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$"
          type: string
        name:
          description: "Display name, unique within the plan ignoring case and repeated\
            \ whitespace."
          example: Design approved
          minLength: 1
          type: string
        sequence:
          description: Ordering within the plan. Each milestone must have a distinct
            positive JSON integer sequence; fractional numbers and strings are rejected.
          example: 1
          format: int32
          minimum: 1
          type: integer
        value:
          description: "A non-negative plain decimal string with at most 4 decimal\
            \ places in PERCENTAGE mode or 10 decimal places in AMOUNT mode, including\
            \ trailing zeros. Excess decimal places are rejected rather than rounded.\
            \ In PERCENTAGE mode, \"30\" means 30%; values must be at most 100 and\
            \ sum to exactly 100. In AMOUNT mode, values are proportional weights\
            \ whose total must be positive, not fixed contract amounts."
          example: "30"
          pattern: "^[0-9]+(\\.[0-9]{1,10})?$"
          type: string
        expected_offset:
          allOf:
          - $ref: '#/components/schemas/MilestoneExpectedOffset'
          description: Optional forecast offset from the contract line start date.
            Omit or send null for no offset.
          example:
            count: 1
            unit: MONTHS
          nullable: true
      required:
      - key
      - name
      - sequence
      - value
    MilestoneTemplate:
      allOf:
      - $ref: '#/components/schemas/MilestoneTemplateRequest'
      - properties:
          id:
            description: Server-generated milestone identifier.
            format: uuid
            type: string
        required:
        - id
    MilestonePlanTemplateRequest:
