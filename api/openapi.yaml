  /health:
    get:
      description: |
        Lightweight liveness probe that returns HTTP 200 when the service process is running, without exercising downstream databases or queues.
        Use for load balancer health checks where you only need to know the JVM responded.
      operationId: health
      parameters: []
      responses:
        "200":
          description: OK
      summary: Returns service health
      tags:
      - Health
  /api-key:
    get:
      description: |
        Confirms the caller’s API key is recognized and returns basic identity metadata such as organization context when authentication succeeds.
        Integrations should call this during bootstrap or rotation to distinguish invalid keys from broader connectivity failures.
      operationId: get-api-key-information
      parameters: []
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
      summary: Gets API key information
      tags:
      - API Key
  /fields:
    get:
      description: |
        Retrieves custom field definitions and their pick-list values for the organization.
        Use the returned field ids with create-field-value and update-field-value when enriching core entities.
      operationId: get-fields
      parameters:
      - description: Filter fields updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      responses:
