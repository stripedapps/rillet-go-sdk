          $ref: '#/components/schemas/MonetaryAmount'
        discount:
          $ref: '#/components/schemas/Discount'
        revenue_pattern:
          $ref: '#/components/schemas/RevenuePattern'
        amending_reference:
          description: External Reference of the contract item being amended.
          type: string
        end_date:
          description: "New end date for the amended (continuing) item. If omitted,\
            \ the item keeps its current end date. Must be on or after the amendment\
            \ date."
          format: date
          type: string
      required:
      - amending_reference
      - price
    RevenueRecognitionOnlyContractTerminatedItemRequest:
      properties:
        external_reference:
          description: External Reference of the contract item being terminated.
          type: string
        end_date:
          description: "Date the item is terminated on. Revenue is recognized through\
            \ this date. Must be on or after the amendment date. If omitted, the item\
            \ is terminated as of the amendment date."
          format: date
          type: string
      required:
      - external_reference
    RevenueRecognitionOnlyContractNewItemInAmendmentRequest:
      properties:
        product_id:
          format: uuid
          type: string
        price:
          $ref: '#/components/schemas/MonetaryAmount'
        discount:
          $ref: '#/components/schemas/Discount'
        revenue_pattern:
          $ref: '#/components/schemas/RevenuePattern'
        start_date:
          description: "By default is the amendment date. If provided, the date has\
            \ to be on or after the amendment date."
          format: date
          type: string
        end_date:
          description: "End date for the new item. If omitted, defaults to the contract\
            \ end date. If provided, must be on or after the item's start date."
          format: date
          type: string
        external_reference:
          $ref: '#/components/schemas/ExternalReference'
      required:
      - external_reference
      - price
      - product_id
      - revenue_pattern
    Address:
      example:
        country: US
        city: Nashville
        state: TN
        line2: Apt 4B
        line1: 123 Main St
        zip_code: "37201"
      properties:
        line1:
          example: 123 Main St
          type: string
        line2:
          example: Apt 4B
          type: string
        city:
          example: Nashville
          type: string
        state:
          description: State or province code. Required for United States addresses
            and optional where it does not apply.
          example: TN
          type: string
        zip_code:
          example: "37201"
          type: string
        country:
          description: Two-letter country code (ISO 3166-1 alpha-2).
          example: US
          type: string
      required:
      - city
      - country
      - line1
      - zip_code
    CustomerAddress:
      allOf:
      - properties:
          id:
            description: "Stable ID of a stored customer address. Use it as billing_address_id\
              \ or shipping_address_id on contracts and invoices. On customer update,\
              \ send it to keep or edit an existing address; omit it to add a new\
              \ address. Omitted in responses when the address no longer exists on\
              \ the customer."
            format: uuid
            type: string
      - $ref: '#/components/schemas/Address'
    CustomerAddresses:
      items:
        $ref: '#/components/schemas/CustomerAddress'
      type: array
    NullableId:
      description: "A UUID, or null to explicitly select nothing. Omitting the field\
        \ is not the same as sending null."
      format: uuid
      type: string
      nullable: true
    SetupUpAutoPaymentRequest:
      example:
        subsidiary_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        subsidiary_id:
          format: uuid
          type: string
      optional:
      - subsidiary_id
    CustomerEmail:
      example:
        id: 0193a6f2-4c1e-7b8a-9d3f-2e5c8a1b7f40
        type: MAIN_SENDER
        email: bobjohnson@somedomain.com
      properties:
        id:
          description: "Stable ID of the customer email, always returned. On customer\
            \ update, send it to keep or edit the email; omit it to add a new email.\
            \ Not accepted on customer create."
          example: 0193a6f2-4c1e-7b8a-9d3f-2e5c8a1b7f40
          format: uuid
          type: string
        email:
          example: bobjohnson@somedomain.com
          type: string
        type:
          enum:
          - MAIN_SENDER
          - CC
          - BCC
          type: string
      required:
      - email
      - type
    EmailRecipientType:
      description: "How the email receives the invoice: MAIN_SENDER is To, CC and\
        \ BCC are copies."
      enum:
      - MAIN_SENDER
      - CC
      - BCC
      type: string
    EmailRecipient:
      properties:
        customer_email_id:
          description: ID of one of the billing customer's emails.
          format: uuid
          type: string
        recipient_type:
          allOf:
          - $ref: '#/components/schemas/EmailRecipientType'
          description: "How this email receives this contract's invoices. It can differ\
            \ from the customer email's type, and changing the customer email's type\
            \ does not change it."
      required:
      - customer_email_id
      - recipient_type
    EmailRecipients:
      items:
        $ref: '#/components/schemas/EmailRecipient'
      type: array
    EmailSelectionMode:
      description: "ALL_CUSTOMER_EMAILS: sent to every email on the billing customer\
        \ at the time of sending, including emails added later, each as its own type.\
        \ SELECTED_EMAILS: sent only to recipients."
      enum:
      - ALL_CUSTOMER_EMAILS
      - SELECTED_EMAILS
      type: string
    EmailSelection:
      properties:
        mode:
          $ref: '#/components/schemas/EmailSelectionMode'
        recipients:
          allOf:
          - $ref: '#/components/schemas/EmailRecipients'
          description: "Required when mode is SELECTED_EMAILS, and an empty list means\
            \ the invoice is not sent to anyone. Must be omitted or empty when mode\
            \ is ALL_CUSTOMER_EMAILS. Always returned; empty in ALL_CUSTOMER_EMAILS\
            \ mode. An email removed from the customer is removed from recipients."
          nullable: true
      required:
      - mode
    CustomerFamily:
      description: "A customer family, without its members."
      example:
        root_parent_customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: Acme Holdings
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        member_count: 4
      properties:
        id:
          format: uuid
          type: string
        name:
          description: Defaults to the root parent customer's name when omitted on
            create.
          example: Acme Holdings
          type: string
        root_parent_customer_id:
          description: |
            The customer at the top of the tree. Every family has exactly one. Not to be confused with
            a member's parent_customer_id, which points at whoever that member reports to.
          format: uuid
          type: string
        member_count:
          description: "How many customers are in the family, counting the one at\
            \ the top. Always at least two."
          example: 4
          type: integer
      required:
      - id
      - member_count
      - name
      - root_parent_customer_id
    CustomerFamilyMember:
      description: One customer's place in a family.
      example:
        name: Acme EMEA
        parent_customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        is_root_parent: true
      properties:
        customer_id:
          format: uuid
          type: string
        name:
          description: "The customer's name, so you can show a list of members without\
            \ looking each one up."
          example: Acme EMEA
          type: string
        parent_customer_id:
          description: The member this customer reports to. Only the customer at the
            top of the tree has none.
          format: uuid
          type: string
          nullable: true
        is_root_parent:
          description: |
            True only for the customer at the top of the tree. This is not the same as having children:
            a member part-way down has children of its own, and is still false.
          type: boolean
      required:
      - customer_id
      - is_root_parent
      - name
    CustomerFamilyRequest:
      example:
        child_links:
        - parent_customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - parent_customer_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
