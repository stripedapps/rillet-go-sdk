      - PROVIDER_IMPORT
      - SCHEDULED_SYNC
      - REIMPORT
      - AURA
      example: UI
      type: string
    ApprovalWorkflowConfigurableSubmissionSources:
      items:
        $ref: '#/components/schemas/ApprovalWorkflowConfigurableSubmissionSource'
      type: array
    ApprovalWorkflowConditionLogic:
      description: |
        How the workflow's conditions combine: `AND` requires every condition to match, `OR` any of them.
      enum:
      - AND
      - OR
      example: AND
      type: string
    ApprovalWorkflowMethod:
      description: |
        How approvers are asked to act. Only `IN_APP` is acted on; `EMAIL` and `SLACK` were withdrawn and
        deliver nothing.
      enum:
      - IN_APP
      - EMAIL
      - SLACK
      example: IN_APP
      type: string
    ApprovalWorkflowSourceType:
      description: |
        Whether a journal entry was created by a person (`MANUAL`) or by Rillet from another record such as a
        bill, invoice or amortisation schedule (`SYSTEM`). `ALL` matches either.
      enum:
      - MANUAL
      - SYSTEM
      - ALL
      example: ALL
      type: string
    ApprovalWorkflowEqualityOperator:
      enum:
      - EQUALS
      - NOT_EQUALS
      example: EQUALS
      type: string
    ApprovalWorkflowCollectionOperator:
      description: |
        How a condition compares against a set of values: `ANY_OF` matches when at least one of them applies,
        `NONE_OF` when none does.
      enum:
      - ANY_OF
      - NONE_OF
      example: ANY_OF
      type: string
    ApprovalWorkflowNumericOperator:
      enum:
      - GREATER_THAN
      - GREATER_THAN_OR_EQUALS
      - LESS_THAN
      - LESS_THAN_OR_EQUALS
      - EQUALS
      example: GREATER_THAN
      type: string
    ApprovalWorkflowConditionGroup:
      description: |
        A set of conditions combined by one logical operator, together with any nested groups, which combine
        into it the same way. A group carries at least one condition or one nested group. Today a workflow
        always has a single group with no nested groups; `groups` exists so that combinations such as
        `A AND (B OR C)` can be expressed without reshaping this contract.
      example:
        groups:
        - null
        - null
        logic: AND
        conditions:
        - id: 0199e21b-be83-7298-a9d6-8c43437117c8
          condition_type: AMOUNT
          operator: GREATER_THAN
          threshold:
            type: MONETARY
            amount:
              amount: "50000.00"
              currency: USD
        - id: 0199e21b-be83-7298-a9d6-8c43437117c8
          condition_type: AMOUNT
          operator: GREATER_THAN
          threshold:
            type: MONETARY
            amount:
              amount: "50000.00"
              currency: USD
      properties:
        logic:
          $ref: '#/components/schemas/ApprovalWorkflowConditionLogic'
        conditions:
          description: |
            Conditions in this group, exactly as stored. A workflow carries at most five conditions across the
            whole tree, not five per group.

            A journal-entry workflow with no `SOURCE_TYPE` condition applies to manually created entries only,
            whatever its other conditions say: that restriction is implied rather than stored. Add a
            `SOURCE_TYPE` condition to have a workflow apply to entries Rillet generates from bills, invoices
            or amortisation schedules.
          items:
            $ref: '#/components/schemas/ApprovalWorkflowCondition'
          type: array
        groups:
          description: |
            Nested groups, each combined into this one by `logic`. Nesting is at most three levels deep.
            Always empty today.
          items:
            $ref: '#/components/schemas/ApprovalWorkflowConditionGroup'
          type: array
      required:
      - conditions
      - logic
    ApprovalWorkflowCondition:
      description: |
        One condition of a workflow. `condition_type` selects the variant.
      discriminator:
        mapping:
          AMOUNT: '#/components/schemas/ApprovalWorkflowAmountCondition'
