    delete:
      description: |
        Removes a bill that should no longer drive AP balances, typically while it remains in draft or was created in error.
        Verify no posted payments, accrual journals, or vendor credit applications still reference the bill before deleting.
      operationId: delete-a-bill
      parameters:
      - description: UUID of the bill to be used in this operation.
        explode: false
        in: path
        name: bill_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a bill
      tags:
      - Bills
    get:
      description: |
        Returns the authoritative bill record including vendor linkage, approval state, open balance, and document references.
        Fetch before update-a-bill because PUT semantics require you to resubmit every field to avoid nulling omitted values.
      operationId: retrieve-a-bill
      parameters:
      - description: UUID of the bill to be used in this operation.
        explode: false
        in: path
        name: bill_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a bill
      tags:
      - Bills
    post:
      description: |
        Attaches a document (PDF, TXT, JPG/JPEG, PNG, GIF, XLSX/XLS, DOCX/DOC, CSV, RTF, TIFF/TIF, BMP, Pages, Numbers, PPTX, or PPT) such as an invoice, contract, or receipt to an existing bill using multipart form data with a single file part.
        Call after the bill exists so approvers and auditors can open the evidence directly from the payable record.
        PDF, JPEG, and PNG keep content-signature validation and do not require a matching filename extension.
        Every other format requires an allowed filename extension and either a matching content type or application/octet-stream.
        Files detected as HTML are rejected regardless of their filename or declared content type.
      operationId: upload-document
      parameters:
      - description: UUID of the bill to be used in this operation.
        explode: false
        in: path
        name: bill_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: "application/pdf, text/plain, image/jpeg, image/png,\
                  \ image/gif, application/octet-stream, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,\
                  \ application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.wordprocessingml.document,\
                  \ application/msword, text/csv, application/csv, application/rtf,\
                  \ text/rtf, image/tiff, image/bmp, image/x-ms-bmp, application/vnd.apple.pages,\
                  \ application/x-iwork-pages-sffpages, application/vnd.apple.numbers,\
                  \ application/x-iwork-numbers-sffnumbers, application/vnd.openxmlformats-officedocument.presentationml.presentation,\
                  \ application/vnd.ms-powerpoint"
                style: form
            schema:
              $ref: '#/components/schemas/upload_contract_document_request'
        required: true
      responses:
        "204":
          description: No content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Uploads a document
      tags:
      - Bills
    put:
      description: |
        IMPORTANT: This is a full-replace operation (PUT semantics). All fields must be
        included in the request body — omitting any field will set it to null, wiping
        existing data. Always call retrieve-a-bill first to fetch the current record,
        then include ALL existing fields in your update request along with your changes.
        Bills with line allocations return 422 BillHasSubsidiaryAllocations, even for a no-op update.
        These allocations cannot be sent through this API; edit the bill in Rillet instead.
      operationId: update-a-bill
      parameters:
      - description: UUID of the bill to be used in this operation.
        explode: false
        in: path
        name: bill_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
