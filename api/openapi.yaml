      required:
      - amount_off
    PercentageDiscount:
      properties:
        percentage_off:
          example: 10
          format: double
          maximum: 100
          minimum: 0
          type: number
        type:
          default: PERCENTAGE
          type: string
      required:
      - percentage_off
    Invoicing:
      discriminator:
        mapping:
          MONTHLY: '#/components/schemas/MonthlyInvoicing'
          MONTHLY_PRORATED: '#/components/schemas/MonthlyProratedInvoicing'
          QUARTERLY: '#/components/schemas/QuarterlyInvoicing'
          SEMI_ANNUAL: '#/components/schemas/SemiAnnualInvoicing'
          YEARLY: '#/components/schemas/YearlyInvoicing'
        propertyName: interval
      oneOf:
      - $ref: '#/components/schemas/MonthlyInvoicing'
      - $ref: '#/components/schemas/MonthlyProratedInvoicing'
      - $ref: '#/components/schemas/QuarterlyInvoicing'
      - $ref: '#/components/schemas/SemiAnnualInvoicing'
      - $ref: '#/components/schemas/YearlyInvoicing'
    MonthlyInvoicing:
      example:
        interval: MONTHLY
        payment_terms: 0
        day: 1
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: MONTHLY
          type: string
        day:
          example: 1
          format: int32
          maximum: 31
          minimum: 1
          type: integer
      required:
      - day
      - interval
      - payment_terms
    MonthlyProratedInvoicing:
      description: |
        Monthly prorated invoicing is only available for contracts with usage products and a minimum usage commitment.
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: MONTHLY_PRORATED
          type: string
        day:
          example: 1
          format: int32
          maximum: 31
          minimum: 1
          type: integer
      required:
      - day
      - interval
      - payment_terms
    QuarterlyInvoicing:
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: QUARTERLY
          type: string
        month_day:
          description: A string in --MM-dd format. Invoices will be created starting
            on that date and every 3 months.
          example: --01-01
          pattern: "^--\\d{2}-\\d{2}$"
          type: string
      required:
      - interval
      - month_day
      - payment_terms
    SemiAnnualInvoicing:
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: SEMI_ANNUAL
          type: string
        month_day:
          description: A string in --MM-dd format. Invoices will be created starting
            on that date and every 6 months.
          example: --01-01
          pattern: "^--\\d{2}-\\d{2}$"
          type: string
      required:
      - interval
      - month_day
      - payment_terms
    YearlyInvoicing:
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: YEARLY
          type: string
        month_day:
          description: A string in --MM-dd format
          example: --01-01
          pattern: "^--\\d{2}-\\d{2}$"
          type: string
      required:
      - interval
      - month_day
      - payment_terms
    UsageInvoicingFrequency:
      enum:
      - MONTHLY
      - QUARTERLY
      - SEMI_ANNUAL
      - YEARLY
      type: string
    MinimumCommitmentInvoicingFrequency:
      description: MONTHLY_PRORATED is only available for CALENDAR usage invoice cycle.
        It need to be the same as contract level invoicing frequency.
      enum:
      - MONTHLY
      - MONTHLY_PRORATED
      - QUARTERLY
      - SEMI_ANNUAL
      - YEARLY
      type: string
    UsageInvoicing:
      example:
