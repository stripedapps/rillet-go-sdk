          example: 0
          format: int32
          minimum: 0
          type: integer
        invoice_date:
          $ref: '#/components/schemas/UsageInvoiceDate'
        cycle:
          $ref: '#/components/schemas/UsageInvoiceCycle'
      required:
      - cycle
      - frequency
      - invoice_date
      - payment_terms
    MinimumCommitmentInvoicing:
      example:
        payment_terms: 0
        frequency: MONTHLY
      properties:
        frequency:
          $ref: '#/components/schemas/MinimumCommitmentInvoicingFrequency'
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
      required:
      - frequency
      - payment_terms
    OverageInvoicing:
      discriminator:
        mapping:
          MONTHLY: '#/components/schemas/OverageMonthlyInvoicing'
          MONTHLY_PRORATED: '#/components/schemas/OverageMonthlyProratedInvoicing'
          QUARTERLY: '#/components/schemas/OverageQuarterlyInvoicing'
          SEMI_ANNUAL: '#/components/schemas/OverageSemiAnnualInvoicing'
          YEARLY: '#/components/schemas/OverageYearlyInvoicing'
        propertyName: interval
      oneOf:
      - $ref: '#/components/schemas/OverageMonthlyInvoicing'
      - $ref: '#/components/schemas/OverageMonthlyProratedInvoicing'
      - $ref: '#/components/schemas/OverageQuarterlyInvoicing'
      - $ref: '#/components/schemas/OverageSemiAnnualInvoicing'
      - $ref: '#/components/schemas/OverageYearlyInvoicing'
    OverageMonthlyInvoicing:
      example:
        interval: MONTHLY
        payment_terms: 0
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: MONTHLY
          type: string
      required:
      - interval
      - payment_terms
    OverageMonthlyProratedInvoicing:
      description: |
        Monthly prorated invoicing is only available for contracts with usage products and a minimum usage commitment.
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: MONTHLY_PRORATED
          type: string
      required:
      - interval
      - payment_terms
    OverageQuarterlyInvoicing:
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: QUARTERLY
          type: string
      required:
      - interval
      - payment_terms
    OverageSemiAnnualInvoicing:
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: SEMI_ANNUAL
          type: string
      required:
      - interval
      - payment_terms
    OverageYearlyInvoicing:
      properties:
        payment_terms:
          example: 0
          format: int32
          minimum: 0
          type: integer
        interval:
          default: YEARLY
          type: string
      required:
      - interval
      - payment_terms
    ContractItemRequest:
      properties:
        id:
          description: "A request-scoped identifier for this contract item, echoed\
            \ back as contract_item_id on each invoice_schedule line. Required on\
            \ the preview-invoice-schedule request and, when invoice_schedule is supplied,\
            \ on create; otherwise optional and ignored. When present, ids must be\
            \ unique within the request."
          type: string
        product_id:
          format: uuid
          type: string
        price:
          $ref: '#/components/schemas/Price'
        quantity:
          description: Must be 1 for USAGE prices.
          example: 1
          minimum: 1
          type: number
        revenue_pattern:
          allOf:
          - $ref: '#/components/schemas/RevenuePattern'
          description: How revenue from this line is recognized. Required for standalone
            products. Ignored on bundle lines.
        progress_plan:
          allOf:
          - $ref: '#/components/schemas/ProgressPlanRequest'
          description: Accepted only with revenue_pattern PROGRESS on FULL contracts.
            Omit to snapshot the product's complete progress_plan_template. An object
            is a complete override rather than a partial merge. Explicit null is invalid.
            Existing accounting-engine eligibility applies; discounted milestone lines
            are currently unsupported.
        discount:
          $ref: '#/components/schemas/Discount'
        tax_rate:
          $ref: '#/components/schemas/TaxRateWithOptionalAmount'
        start_date:
          description: Defaults to the contract start date.
          format: date
          type: string
        end_date:
          description: Defaults to the contract end date.
          format: date
          type: string
        external_reference:
          $ref: '#/components/schemas/ExternalReference'
        fields:
          items:
            $ref: '#/components/schemas/FieldAssignments_inner'
          type: array
        usage_minimum_commitment:
          $ref: '#/components/schemas/UsageCommitment'
        description:
          description: |
            Overrides the product description on invoice lines generated for this item. Use it when the same product needs different wording per contract. When omitted or blank, the product's own description is used.
          type: string
        declared_ssp:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: Optional per-unit SSP override in the line price currency and
            billing interval. Not supported on bundle lines; SSP allocation for bundles
            is defined by their components. Must be positive. Requires SSP revenue
            recognition and a non-usage product included in SSP allocation. Omit or
            send null to use product SSP. Accepted on creation only; updates cannot
            change SSP.
          nullable: true
      required:
      - price
      - product_id
      - quantity
    RevenueRecognitionOnlyContractItemRequest:
      properties:
        product_id:
          format: uuid
          type: string
        price:
          $ref: '#/components/schemas/MonetaryAmount'
        discount:
          $ref: '#/components/schemas/Discount'
        revenue_pattern:
          $ref: '#/components/schemas/RevenuePattern'
        start_date:
          description: Defaults to the contract start date.
          format: date
          type: string
        end_date:
          description: Defaults to the contract end date.
          format: date
          type: string
        external_reference:
          $ref: '#/components/schemas/ExternalReference'
        declared_ssp:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: "Optional total standalone value for this item, in the line\
            \ price currency. Must be positive. Requires SSP revenue recognition and\
            \ a non-usage product included in SSP allocation. Omit or send null to\
            \ use product SSP. Accepted on creation only; updates cannot change SSP."
          nullable: true
      required:
      - external_reference
      - price
      - product_id
      - revenue_pattern
    ContractScope:
      description: "The \"FULL\" scope includes revenue recognition and invoicing\
        \ handled in Rillet. With the \"REVENUE_RECOGNITION_ONLY\" scope, invoicing\
        \ is handled outside Rillet."
      enum:
      - FULL
      - REVENUE_RECOGNITION_ONLY
      type: string
    InvoiceScope:
      description: "The \"FULL\" scope includes revenue recognition and invoicing\
        \ handled in Rillet. With the \"REVENUE_RECOGNITION_ONLY\" scope, invoicing\
        \ is handled outside Rillet."
      enum:
      - FULL
      - REVENUE_RECOGNITION_ONLY
      type: string
    UsageConfiguration:
      example:
        minimum_commitment_cycle: MONTHLY
        usage_invoicing:
          payment_terms: 0
          cycle: CALENDAR
          frequency: MONTHLY
          invoice_date: FIRST_DAY_OF_NEXT_CYCLE
        minimum_commitment_invoicing:
          payment_terms: 0
          frequency: MONTHLY
        contract_level_minimum_commitment:
          amount:
            amount: "1.01"
            currency: USD
          revenue_account: "11112"
      properties:
        usage_invoicing:
          $ref: '#/components/schemas/UsageInvoicing'
        minimum_commitment_invoicing:
          $ref: '#/components/schemas/MinimumCommitmentInvoicing'
        minimum_commitment_cycle:
          description: Determines how often does the minimum commitment reset.
          enum:
          - MONTHLY
          - CONTRACT
          type: string
        contract_level_minimum_commitment:
          $ref: '#/components/schemas/UsageCommitment'
      required:
      - usage_invoicing
    UsageInvoiceDate:
      description: When the usage invoice is created in relation to the usage cycle.
      enum:
      - FIRST_DAY_OF_NEXT_CYCLE
      - LAST_DAY_OF_CURRENT_CYCLE
      type: string
    UsageInvoiceCycle:
      description: "When does the invoicing pricing cycle reset and results in an\
        \ invoice. Calendar option is only allowed when usage invoice frequency is\
        \ Monthly, and contract does not start on the 1st of the Month."
      enum:
      - CALENDAR
      - SUBSCRIPTION_ANNIVERSARY
      type: string
    CreateFullContractRequest:
      properties:
        name:
          example: New API Contract
          type: string
        close_date:
          format: date
          type: string
        start_date:
          format: date
          type: string
        end_date:
          format: date
          type: string
        items:
          items:
            $ref: '#/components/schemas/ContractItemRequest'
          minItems: 1
          type: array
        invoicing:
          $ref: '#/components/schemas/Invoicing'
        usage_configuration:
          $ref: '#/components/schemas/UsageConfiguration'
        external_references:
          items:
            $ref: '#/components/schemas/ExternalReference'
          type: array
          uniqueItems: true
        customer_id:
          format: uuid
          type: string
        subsidiary_id:
          format: uuid
          type: string
        shipping_customer_id:
          description: "The customer to ship to. Omit, or send customer_id, to ship\
            \ to the billing customer."
          format: uuid
          type: string
        billing_address_id:
          allOf:
          - $ref: '#/components/schemas/NullableId'
          description: "ID of one of the billing customer's billing_addresses. If\
            \ omitted, the first address in the customer's billing_addresses is used,\
            \ or none when the customer has no billing address. Send null for no billing\
            \ address; rejected when a tax provider is connected. Rejected when the\
            \ address does not belong to the billing customer or is not a billing\
            \ address."
        shipping_address_id:
          allOf:
          - $ref: '#/components/schemas/NullableId'
          description: "ID of one of the ship-to customer's shipping_addresses. If\
            \ omitted, the first address in the ship-to customer's shipping_addresses\
            \ is used, or none when it has no shipping address. Send null for no shipping\
            \ address. Rejected when the address does not belong to the ship-to customer\
            \ or is not a shipping address. When a shipping address is set it determines\
            \ tax; otherwise the billing address does."
        email_selection:
          allOf:
          - $ref: '#/components/schemas/EmailSelection'
          description: Who receives the invoices. Omit to send to all of the billing
            customer's emails (ALL_CUSTOMER_EMAILS).
        exchange_rate:
          $ref: '#/components/schemas/ExchangeRate'
        purchase_order_number:
          description: "Optional purchase order number. When set, it is copied onto\
            \ every invoice generated by the contract."
          maxLength: 50
          type: string
        invoice_schedule:
          $ref: '#/components/schemas/ContractInvoiceSchedule'
      required:
      - close_date
      - customer_id
      - items
      - name
      - start_date
    CreateRevenueRecognitionOnlyContractRequest:
      properties:
        name:
          example: New API Contract
          type: string
        close_date:
          description: Defaults to the start date if not provided.
          format: date
          type: string
        start_date:
          format: date
          type: string
        end_date:
          format: date
          type: string
        items:
          items:
            $ref: '#/components/schemas/RevenueRecognitionOnlyContractItemRequest'
          minItems: 1
          type: array
        invoice_schedule:
          $ref: '#/components/schemas/InvoiceSchedule'
        external_references:
          items:
            $ref: '#/components/schemas/ExternalReference'
          type: array
          uniqueItems: true
        customer_id:
          format: uuid
          type: string
        subsidiary_id:
          format: uuid
          type: string
      required:
      - customer_id
      - external_references
      - invoice_schedule
      - items
      - name
      - start_date
    CreateContractRequest:
      discriminator:
        mapping:
