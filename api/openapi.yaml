    ContractInvoiceSchedule:
      description: "The computed invoice schedule for a contract, returned by the\
        \ preview endpoint. When resubmitted on create as invoice_schedule it replaces\
        \ the FIXED billing layout with an arbitrary set of invoices: for each contract\
        \ item the submitted FIXED line totals must sum to its computed value (redistribution\
        \ only), and USAGE / USAGE_COMMITMENT lines are computed by the system and\
        \ must not be submitted. Revenue recognition and TCV are unaffected. See ContractInvoiceScheduleItem\
        \ for the per-line rules."
      example:
        invoices:
        - total:
            amount: "1.01"
            currency: USD
          issue_date: 2000-01-23
          currency: USD
          items:
          - billing_period:
              start: 2000-01-23
              end: 2000-01-23
            quantity: quantity
            total_amount:
              amount: "1.01"
              currency: USD
            description: description
            price_type: FIXED
            unit_amount:
