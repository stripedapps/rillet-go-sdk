          maxItems: 100
          minItems: 1
          type: array
      required:
      - measure
      - milestones
      - value_mode
    ContractMilestoneRequest:
      properties:
        key:
          description: "Stable integration identifier, unique within the plan ignoring\
            \ case. UUID-shaped keys are rejected."
          example: design-approved
          pattern: "^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$"
          type: string
        name:
          description: "Display name, unique within the plan ignoring case and repeated\
            \ whitespace."
          example: Design approved
          minLength: 1
          type: string
        sequence:
          description: Ordering within the plan. Each milestone must have a distinct
            positive JSON integer sequence; fractional numbers and strings are rejected.
          example: 1
          format: int32
          minimum: 1
          type: integer
        percentage:
          description: "Required only in PERCENTAGE mode. A non-negative plain decimal\
            \ string in 0-100 units; all milestones must total exactly 100. \"30\"\
            \ means 30 percent. At most 4 decimal places are allowed, including trailing\
            \ zeros; excess decimal places are rejected rather than rounded."
          example: "30"
          pattern: "^[0-9]+(\\.[0-9]{1,4})?$"
          type: string
        amount:
