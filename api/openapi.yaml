    parameters:
    - description: UUID of the field to be used in this operation.
      explode: false
      in: path
      name: fieldId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    - description: UUID of the fieldValue to be used in this operation.
      explode: false
