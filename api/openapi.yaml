            \ null with a shipping_address_id ships to the billing customer."
        billing_address_id:
          allOf:
          - $ref: '#/components/schemas/NullableId'
          description: "ID of one of the billing customer's billing_addresses. If\
            \ omitted, the first address in the customer's billing_addresses is used,\
            \ or none when the customer has no billing address. Send null for no billing\
            \ address. On update, omit to keep the current billing address, or send\
            \ null to remove it. Rejected when the address does not belong to the\
            \ billing customer or is not a billing address."
