          allOf:
          - $ref: '#/components/schemas/NullableId'
          description: "ID of one of the ship-to customer's shipping_addresses. If\
            \ omitted, the first address in the ship-to customer's shipping_addresses\
            \ is used, or none when it has no shipping address. Send null for no shipping\
            \ address. On update, omit to keep the current shipping address, or send\
            \ null to remove it; a new shipping_customer_id sent without this field\
            \ takes that customer's first shipping address. Rejected when the address\
            \ does not belong to the ship-to customer or is not a shipping address."
