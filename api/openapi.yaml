        - id: "234"
          type: xyzSystemId
          url: https://xyzsystempage.com/ids/234
      properties:
        id:
          description: Stable server-generated identifier for this contract milestone.
          format: uuid
          type: string
        key:
          description: Stable integration key copied from the product template or
            explicit contract plan.
          type: string
        name:
          type: string
        sequence:
          format: int32
          type: integer
        percentage:
          description: Present only in PERCENTAGE mode. "30" means 30 percent.
          type: string
          nullable: true
        allocated_amount:
          allOf:
          - $ref: '#/components/schemas/RoundedMonetaryAmount'
          description: Present only in PERCENTAGE mode; the monetary allocation calculated
            for this contract line.
          nullable: true
        amount:
          allOf:
          - $ref: '#/components/schemas/RoundedMonetaryAmount'
          description: Present only in AMOUNT mode. No duplicate allocated_amount
            is returned in that mode.
          nullable: true
        expected_date:
          format: date
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ContractMilestoneStatus'
        completed_date:
          format: date
          type: string
          nullable: true
        memo:
          type: string
          nullable: true
        external_references:
          items:
            $ref: '#/components/schemas/ExternalReference'
          type: array
          uniqueItems: true
        cancellation:
          allOf:
          - $ref: '#/components/schemas/ContractMilestoneCancellation'
          nullable: true
      required:
      - external_references
      - id
      - key
      - name
      - sequence
      - status
    UpdateMilestoneCompletionRequest:
      example:
        memo: memo
        completed_date: 2000-01-23
        external_references:
        - id: "234"
          type: xyzSystemId
          url: https://xyzsystempage.com/ids/234
        - id: "234"
          type: xyzSystemId
          url: https://xyzsystempage.com/ids/234
      properties:
        completed_date:
          description: Actual completion date. It must fall within the owning contract
            line term.
          format: date
          type: string
        memo:
          description: Optional completion note. Omit or send null to clear the saved
            note.
          type: string
          nullable: true
        external_references:
          description: "Complete replacement of completion references. Omit, send\
            \ null, or send an empty array to clear them. Every type must already\
            \ be configured for the organization."
          items:
            $ref: '#/components/schemas/ExternalReference'
          type: array
          uniqueItems: true
          nullable: true
      required:
      - completed_date
    CancelMilestoneRequest:
      example:
        effective_date: 2000-01-23
      properties:
        effective_date:
          description: Cancellation business date within the contract term and allowed
            accounting period.
          format: date
          type: string
      required:
      - effective_date
    FixedPrice:
      properties:
        amount:
          $ref: '#/components/schemas/MonetaryAmount'
      required:
      - amount
    RecurringPrice:
      properties:
        interval_months:
          example: 1
          format: int32
          maximum: 12
          minimum: 1
          type: integer
      required:
      - interval_months
    Price:
      discriminator:
        mapping:
          FIXED_RECURRING: '#/components/schemas/FixedRecurringPrice'
          ONE_TIME: '#/components/schemas/OneTimePrice'
          USAGE: '#/components/schemas/UsagePrice'
        propertyName: type
      example:
        type: FIXED_RECURRING
        amount:
          amount: "10.00"
          currency: USD
        interval_months: 1
      oneOf:
      - $ref: '#/components/schemas/FixedRecurringPrice'
      - $ref: '#/components/schemas/OneTimePrice'
      - $ref: '#/components/schemas/UsagePrice'
    FixedRecurringPrice:
      allOf:
      - $ref: '#/components/schemas/FixedPrice'
      - $ref: '#/components/schemas/RecurringPrice'
      - properties:
          type:
            default: FIXED_RECURRING
            type: string
        required:
        - type
    OneTimePrice:
      allOf:
      - $ref: '#/components/schemas/FixedPrice'
      - properties:
          type:
            default: ONE_TIME
            type: string
        required:
        - type
    UsagePrice:
      allOf:
      - $ref: '#/components/schemas/RecurringPrice'
      - properties:
          type:
            default: USAGE
            type: string
          billing_scheme:
            $ref: '#/components/schemas/BillingScheme'
        required:
        - billing_scheme
        - type
    BillingScheme:
      discriminator:
        mapping:
          PER_UNIT: '#/components/schemas/PerUnitBilling'
          TIERED: '#/components/schemas/TieredBilling'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/PerUnitBilling'
      - $ref: '#/components/schemas/TieredBilling'
    PerUnitBilling:
      properties:
        type:
          default: PER_UNIT
          type: string
        amount:
          $ref: '#/components/schemas/MonetaryAmount'
        units:
          example: 1
          format: int32
          minimum: 1
          type: integer
      required:
      - amount
      - type
      - units
    TieredBilling:
      description: All tiers except for the highest have to define a value for upTo.
        There cannot be more than one tier with the same upTo value.
      properties:
        type:
          default: TIERED
          type: string
        mode:
          description: "In metered tiering, the maximum quantity within a period determines\
            \ the price. In graduated tiering, pricing changes as the quantity grows\
            \ – the price from each tier up to the reported quantity is accumulated."
          enum:
          - GRADUATED
          - METERED
          type: string
        tiers:
          items:
            $ref: '#/components/schemas/Tier'
          minItems: 1
          type: array
      required:
      - mode
      - tiers
      - type
    Tier:
      description: At least one of flatPrice or perUnitPrice has to be defined. flatPrice
        is the price for the entire tier. perUnitPrice is price for units relevant
        to the tier.
      properties:
        up_to:
          example: 10
          format: int32
          minimum: 1
          type: integer
        flat_price:
          $ref: '#/components/schemas/MonetaryAmount'
        per_unit_price:
          $ref: '#/components/schemas/MonetaryAmount'
      required:
      - up_to
    TaxRateWithOptionalAmount:
      properties:
        percentage:
          example: "0"
          format: number
          maximum: 100
          minimum: 0
          type: string
        tax_amount:
          $ref: '#/components/schemas/RoundedMonetaryAmount'
        country:
          description: Two-letter country code (ISO 3166-1 alpha-2).
          example: US
          type: string
        type:
          enum:
          - VAT
          - SALES_TAX
          type: string
        description:
          type: string
      required:
      - country
      - description
      - percentage
      - type
    TaxRateWithOptionalAmountAndCode:
      allOf:
      - $ref: '#/components/schemas/TaxRateWithOptionalAmount'
      example:
        tax_code: tax_code
      properties:
        tax_code:
          description: "Code of a predefined tax rate. When provided, the rate's percentage,\
            \ country, type, and description are loaded from the tax rate catalog.\
            \ Available codes can be fetched from the list tax rates endpoint."
    TaxRate:
      allOf:
      - $ref: '#/components/schemas/TaxRateWithOptionalAmount'
      example:
        tax_amount:
          amount: "1.01"
          currency: USD
        country: US
        percentage: "0"
        description: description
        type: VAT
      required:
      - tax_amount
    ExpenseTaxRate:
      allOf:
      - $ref: '#/components/schemas/TaxRate'
      - properties:
          tax_code:
            description: "Code of a predefined tax rate. When provided, the rate's\
              \ percentage, country, and description are used instead of the inline\
              \ values."
            type: string
          coverage:
            enum:
            - INCLUSIVE
            - EXCLUSIVE
            type: string
        required:
        - coverage
      example:
        tax_amount:
          amount: "1.01"
          currency: USD
        coverage: INCLUSIVE
        country: US
        tax_code: tax_code
        percentage: "0"
        description: description
        type: VAT
    Product:
      example:
        include_in_ssp: true
        revenue_pattern: ""
        description: Subscription to english classes
        type: ""
        progress_plan_template: ""
        price:
          type: FIXED_RECURRING
          amount:
            amount: "10.00"
            currency: USD
          interval_months: 1
        include_in_arr_mrr: true
        name: English subscription
        account_code: ""
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        fields: ""
        bundle: ""
        external_references:
        - id: "234"
          type: xyzSystemId
          url: https://xyzsystempage.com/ids/234
        - id: "234"
          type: xyzSystemId
          url: https://xyzsystempage.com/ids/234
        status: ACTIVE
      properties:
        id:
          format: uuid
        type:
          allOf:
          - $ref: '#/components/schemas/ProductType'
          description: Whether this is a standalone product or a bundle.
        name:
          example: English subscription
        description:
          example: Subscription to english classes
        price:
          $ref: '#/components/schemas/Price'
        include_in_arr_mrr: {}
        include_in_ssp:
          description: Whether this product participates in SSP revenue allocation.
            Omitted for bundles. Usage-priced products remain excluded regardless
            of this flag.
        revenue_pattern:
          allOf:
          - $ref: '#/components/schemas/RevenuePattern'
          description: How revenue from this product is recognized. Omitted for bundles.
        progress_plan_template:
          allOf:
          - $ref: '#/components/schemas/ProgressPlanTemplate'
          description: Default progress configuration for PROGRESS products. Product
            edits do not rewrite existing contract plans.
          nullable: true
        external_references:
          items:
            $ref: '#/components/schemas/ExternalReference'
          uniqueItems: true
        fields:
          allOf:
          - $ref: '#/components/schemas/FieldAssignments'
