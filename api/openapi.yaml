        System-generated and non-posting entries are not supported.
      operationId: list-journal-entry-documents
      parameters:
      - description: UUID of an existing manual journal entry.
        explode: false
        in: path
        name: journal_entry_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/JournalEntryDocument'
                type: array
          description: Attached documents
        "404":
          description: Manual journal entry not found or not accessible
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists documents attached to a manual journal entry
      tags:
      - Journal Entry Documents
    parameters:
    - description: UUID of an existing manual journal entry.
      explode: false
      in: path
      name: journal_entry_id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: |
        Appends one PDF, JPEG, PNG, or XLSX of at most 20 MiB to an existing manual journal entry.
        Create the journal entry first; for asynchronous imports, wait until the entry is available.
        Existing attachments are preserved. Repeating an upload creates another attachment.
        A journal entry can have at most 10 attachments, including files uploaded through the Rillet application.
        Attachments may be added to approved entries and entries in closed periods without changing accounting data or approval status.
        System-generated and non-posting entries are not supported.
      operationId: upload-journal-entry-document
      parameters:
      - description: UUID of an existing manual journal entry.
        explode: false
        in: path
        name: journal_entry_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: "application/pdf, image/jpeg, image/png, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                style: form
            schema:
              $ref: '#/components/schemas/upload_contract_document_request'
        required: true
      responses:
        "204":
          description: Document attached
        "400":
          description: "Empty file, missing filename, unsupported file content, or\
            \ attachment limit reached"
        "404":
          description: Manual journal entry not found or not accessible
        "413":
          description: File exceeds the size limit
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Uploads a document to a manual journal entry
      tags:
      - Journal Entry Documents
  /journal-entries/{journal_entry_id}:
    delete:
      description: |
        Deletes a manual journal entry that should be excluded from the ledger, typically prior to period lock while corrections remain allowed.
        Verify dependent reconciliations or downstream consolidations no longer rely on the entry before removal.
      operationId: delete-a-journal-entry
      parameters:
      - description: UUID of the journal entry to be used in this operation.
        explode: false
        in: path
        name: journal_entry_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a journal entry
      tags:
      - Journal Entries
    get:
      description: |
        Retrieves a journal entry with every line, account reference, and reconciliation flag needed for close review or downstream edits.
        Call before update-a-journal-entry so you can merge new edits with existing lines without accidentally dropping balances.
      operationId: retrieve-a-journal-entry
      parameters:
      - description: UUID of the journal entry to be used in this operation.
        explode: false
        in: path
        name: journal_entry_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a journal entry
      tags:
      - Journal Entries
    put:
      description: |
        Replaces the lines and header metadata on an existing manual journal entry, subject to the same balancing rules as creation.
        Always include the complete line list retrieved beforehand because partial payloads can clear fields the API treats as optional.
      operationId: update-a-journal-entry
      parameters:
      - description: UUID of the journal entry to be used in this operation.
        explode: false
        in: path
        name: journal_entry_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJournalEntryRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates a journal entry
      tags:
      - Journal Entries
  /bank-accounts:
    get:
      description: |
        Returns cash bank accounts configured for the organization, optionally filtered by subsidiary.
        Bank account ids anchor transaction import, reconciliation, and treasury automations.
      operationId: list-all-bank-accounts
      parameters:
      - $ref: '#/components/parameters/subsidiary_id'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_bank_accounts_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all bank accounts
      tags:
      - Bank accounts
    post:
      description: |
        Registers a treasury bank account with currency, institution identifiers, and linkage to the GL cash account used during transaction import.
        Accurate mapping here ensures invoice payments, bill payments, and bank feeds all post to the same cash subledger.
      operationId: create-a-bank-account
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBankAccountRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a bank account
      tags:
      - Bank accounts
  /bank-accounts/{bank_account_id}:
    delete:
      description: |
        Removes a bank account definition when the entity closed the account or you mistakenly created a duplicate connector mapping.
        Ensure no scheduled payments or open reconciliation batches still target this bank account before deletion.
      operationId: delete-a-bank-account
      parameters:
      - description: UUID of the bank account to be used in this operation.
        explode: false
        in: path
        name: bank_account_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a bank account
      tags:
      - Bank accounts
    get:
      description: |
        Returns configuration and status for a single bank account, including identifiers downstream connectors need when refreshing balances.
        Use before deleting or updating metadata so you preserve institution codes and default subsidiary routing.
      operationId: retrieve-a-bank-account
      parameters:
      - description: UUID of the bank account to be used in this operation.
        explode: false
        in: path
        name: bank_account_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a bank account
      tags:
      - Bank accounts
  /bank-accounts/{bank_account_id}/balance:
    get:
      description: |
        Returns the latest stored bank balance on or before the requested date in the bank account's native currency.
        The response includes the stored balance date so consumers can identify when the latest available balance predates the requested date.
      operationId: retrieve-a-bank-account-balance
      parameters:
      - description: UUID of the bank account.
        explode: false
        in: path
        name: bank_account_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Date on or before which to retrieve the latest stored bank balance
          (ISO-8601 format).
        explode: true
        in: query
        name: as_of_date
        required: true
        schema:
          format: date
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountBalance'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a bank account balance
      tags:
      - Bank accounts
  /bank-transactions:
    get:
      description: |
        Streams imported or manually entered cash activity for reconciliation, optionally scoped by bank account, subsidiary, or updated-since filters.
        Pair results with retrieve-a-bank-transaction when you need memo-level detail before marking items cleared.
      operationId: list-all-bank-transactions
      parameters:
      - description: Filter by bank account
        explode: true
        in: query
        name: bank_account_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - $ref: '#/components/parameters/subsidiary_id'
      - description: Filter bank transactions updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      - description: Filter bank transactions with date on or after this date
        explode: true
        in: query
        name: date.gte
        required: false
        schema:
          example: 2023-01-01
          format: date
          type: string
        style: form
      - description: Filter bank transactions with date on or before this date
        explode: true
        in: query
        name: date.lte
        required: false
        schema:
          example: 2023-12-31
          format: date
          type: string
        style: form
      - description: Field to sort results by (see enum values).
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          enum:
          - created
          - updated
          type: string
        style: form
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_bank_transactions_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all bank transactions
      tags:
      - Bank Transactions
    post:
      description: |
        Inserts a single bank feed line such as a wire, ACH, or adjustment when automated imports miss a statement row.
        Specify the hosting bank account and value dates so cash reporting matches what treasury already booked externally.
      operationId: create-a-bank-transaction
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBankTransactionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a bank transaction
      tags:
      - Bank Transactions
  /bank-transactions/reconcile/transactions:
    post:
      description: |
        Matches bank transactions to existing records. You can include different record types in one request, subject to
        the supported match combinations. To book a difference, provide reconciliation_adjustment.account_id.
        Optional reconciliation_adjustment.fields are custom field and value IDs applied to the adjustment entry,
        not to the matched records. Rillet calculates the difference.
      operationId: match-bank-transactions-to-records
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchBankTransactionsRequest'
        required: true
      responses:
        "204":
          description: Bank transactions matched.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Matches bank transactions to existing records
      tags:
      - Cash Matching
  /bank-transactions/reconcile/quick-entry:
    post:
      description: |
        Creates a separate quick entry for each bank transaction in transaction_ids, using the same requested details.
        The transactions are not combined into one many-to-one (N:1) match. With line_items, supply exactly one ID.
      operationId: match-bank-transactions-with-quick-entry
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchBankTransactionsQuickEntryRequest'
        required: true
      responses:
        "204":
          description: Bank transactions matched.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Matches bank transactions with new quick entries
      tags:
      - Cash Matching
  /bank-transactions/reconcile/transfer:
    post:
      description: "Matches two bank transactions as a transfer. The source transaction\
        \ may be incoming or outgoing; the\ntransaction amounts determine the direction.\
        \ Cross-subsidiary transfers require access to both subsidiaries. \nFor a\
        \ same-subsidiary transfer with a difference, provide reconciliation_adjustment.account_id;\n\
        reconciliation_adjustment.fields apply to the adjustment line. If either bank\
        \ transaction has a fee, provide \nfees_account_id to book it. A transfer\
        \ with fees on both bank transactions is not supported.\n"
      operationId: match-bank-transactions-as-transfer
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchBankTransactionsTransferRequest'
        required: true
      responses:
        "204":
          description: Bank transactions matched.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Matches two bank transactions as a transfer
      tags:
      - Cash Matching
  /bank-transactions/{bank_transaction_id}:
    delete:
      description: |
        Removes a bank transaction row that was imported twice or created in error before it affects reconciled cash balances.
        Confirm treasury agrees the underlying bank activity will not return on the next feed pull before deleting.
      operationId: delete-a-bank-transaction
      parameters:
      - description: UUID of the bank transaction to be used in this operation.
        explode: false
        in: path
        name: bank_transaction_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a bank transaction
      tags:
      - Bank Transactions
    get:
      description: |
        Fetches one bank transaction with counterparty text, amounts, and links to the Rillet transactions it settled.
        Use the reconciled transaction IDs to retrieve the reconciled bills, invoices, journal entries, or other source records.
      operationId: retrieve-a-bank-transaction
      parameters:
      - description: UUID of the bank transaction to be used in this operation.
        explode: false
        in: path
        name: bank_transaction_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a bank transaction
      tags:
      - Bank Transactions
    put:
      description: |
        Adjusts memo, categorization, or reconciliation metadata on an existing bank transaction without re-importing the entire feed batch.
        Supply the full body expected by the schema so optional fields you intend to keep are not unintentionally cleared.
      operationId: update-a-bank-transaction
      parameters:
      - description: UUID of the bank transaction to be used in this operation.
        explode: false
        in: path
        name: bank_transaction_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBankTransactionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates a bank transaction
      tags:
      - Bank Transactions
  /tax-rates:
    get:
      description: Returns all available tax rates. Use the returned IDs when creating
        bills with specific tax codes.
      operationId: list-all-tax-rates
      parameters:
      - description: "Two-letter country code (ISO 3166-1 alpha-2). If provided, only\
          \ tax rates for that country are returned."
        explode: true
        in: query
        name: country
        required: false
        schema:
          $ref: '#/components/schemas/CountryCode'
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_tax_rates_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all tax rates
      tags:
      - Tax rates
  /reports/arr-waterfall:
    get:
      description: |
        Returns the ARR waterfall dataset for the requested month with optional breakdown dimensions, subsidiary filters, and pagination cursors for large tenants.
        Finance teams use this to explain beginning ARR, new business, expansion, contraction, and churn between periods.
      operationId: retrieve-waterfall-report
      parameters:
      - $ref: '#/components/parameters/month'
      - $ref: '#/components/parameters/status'
      - $ref: '#/components/parameters/breakdown'
      - $ref: '#/components/parameters/subsidiary_id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueWaterfall'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves ARR waterfall report
      tags:
      - Reports
  /books:
    get:
      description: |
        Returns all accounting books available to the authenticated organization.
        Successful responses always contain at least one book and list the primary book first.
        Only primary and adjustment-overlay book IDs can be used with report and journal-entry endpoints that accept a book_id.
      operationId: list-all-books
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_books_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all books
      tags:
      - Books
  /books/periods:
    get:
      description: |
        Returns every accounting period for the organization, newest first, regardless of whether each period is open or closed.
        Use the returned ids to open or close the books or a specific subledger. The complete monthly history is returned without pagination.
        Responds with HTTP 404 when the organization has no book periods.
      operationId: list-all-book-periods
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_all_book_periods_200_response'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists all book periods
      tags:
      - Books periods
  /books/periods/last-closed:
    get:
      description: |
        Returns the most recently closed accounting period for book-close workflows, including closed-on timestamps your automation can cache.
        When no period has ever been closed the API responds with HTTP 404, so treat a missing resource as "not yet closed" rather than an outage.
      operationId: retrieve-last-book-closed-period
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves last book closed period
      tags:
      - Books periods
  /books/periods/{date}:
    get:
      description: |
        Returns the accounting period containing the requested date, regardless of whether the period is open or closed.
        Use the returned id to open or close the books or a specific subledger. Responds with HTTP 404 when no period contains the date.
      operationId: retrieve-a-book-period
      parameters:
      - description: Date within the requested accounting period.
        example: 2026-01-15
        explode: false
        in: path
        name: date
        required: true
        schema:
          format: date
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPeriod'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Retrieves a book period by date
      tags:
      - Books periods
  /close-checklists/{period}/tasks:
    get:
      description: |
        Returns the month-end close checklist for one accounting month: every task with its notes, due date,
        preparer, reviewer queue, completion and sign-off state. Use it to report close progress or to find the
        task_id needed by update, complete and sign-off. Resolve preparer and reviewer user ids to people with
        list-members (match on user_id). Responds with HTTP 404 when no checklist exists for the month.
      operationId: list-close-checklist-tasks
      parameters:
      - $ref: '#/components/parameters/closeChecklistPeriod'
      - description: Only return tasks in this status.
        explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/CloseChecklistTaskStatus'
        style: form
      - description: "Only return tasks whose assigned preparer, or the user who completed\
          \ them, is one of these user ids (comma-separated). A task completed by\
          \ someone other than its assigned preparer matches either user."
        explode: true
        in: query
        name: preparer_ids
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
        style: form
      - description: Only return tasks where one of these user ids is a reviewer (comma-separated).
        explode: true
        in: query
        name: reviewer_ids
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseChecklist'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Lists close checklist tasks
      tags:
      - Close Checklist
  /close-checklists/{period}/tasks/{task_id}:
    patch:
      description: |
        Partial update of one task's details and assignments. Fields omitted from the body are left unchanged.
        Completion and reviewer sign-offs cannot be set or cleared here; use complete-a-close-checklist-task and
        sign-off-a-close-checklist-task. A reviewer who has already signed off keeps their place in the queue:
        a reviewer_ids list that drops or moves them is rejected with HTTP 409. Every preparer and reviewer must
        be an active member of the organization (see list-members). Returns the updated task.
      operationId: update-a-close-checklist-task
      parameters:
      - $ref: '#/components/parameters/closeChecklistPeriod'
      - $ref: '#/components/parameters/closeChecklistTaskId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCloseChecklistTaskRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseChecklistTask'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates a close checklist task
      tags:
      - Close Checklist
  /close-checklists/{period}/tasks/{task_id}/complete:
    post:
      description: |
        Marks the task as prepared, recorded as completed by the connected user at the current time. Requires
        an OAuth connection made by a named user; API keys are rejected with HTTP 403 because they do not act as
        a user. A task that is already completed is rejected with HTTP 409 so an earlier preparer's record is
        never overwritten. Returns the updated task.
      operationId: complete-a-close-checklist-task
      parameters:
      - $ref: '#/components/parameters/closeChecklistPeriod'
      - $ref: '#/components/parameters/closeChecklistTaskId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseChecklistTask'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Completes a close checklist task
      tags:
      - Close Checklist
  /close-checklists/{period}/tasks/{task_id}/sign-off:
    post:
      description: |
        Records the connected user's review sign-off on a completed task. Requires an OAuth connection made by a
        named user; API keys are rejected with HTTP 403. The task must be completed first (HTTP 409 otherwise).
        Only a reviewer on the task who has not signed off yet may sign off (HTTP 403 otherwise); when the
        organization enforces an ordered reviewer queue, it must also be their turn. A fully signed-off task is
        rejected with HTTP 409. Returns the updated task.
      operationId: sign-off-a-close-checklist-task
      parameters:
      - $ref: '#/components/parameters/closeChecklistPeriod'
      - $ref: '#/components/parameters/closeChecklistTaskId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseChecklistTask'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Signs off a close checklist task as reviewer
      tags:
      - Close Checklist
  /health:
    get:
      description: |
        Lightweight liveness probe that returns HTTP 200 when the service process is running, without exercising downstream databases or queues.
        Use for load balancer health checks where you only need to know the JVM responded.
      operationId: health
      parameters: []
      responses:
        "200":
          description: OK
      summary: Returns service health
      tags:
      - Health
  /api-key:
    get:
      description: |
        Confirms the caller’s API key is recognized and returns basic identity metadata such as organization context when authentication succeeds.
        Integrations should call this during bootstrap or rotation to distinguish invalid keys from broader connectivity failures.
      operationId: get-api-key-information
      parameters: []
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
      summary: Gets API key information
      tags:
