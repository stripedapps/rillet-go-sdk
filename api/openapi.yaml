    CurrencyCode:
      description: Currency code following ISO-4217
      example: USD
      type: string
    MonetaryAmount:
      example:
        amount: "1.01"
        currency: USD
      properties:
        amount:
          description: "Monetary amount in decimal format, using a period (.) as the\
            \ decimal separator. (e.g. '1.01' in $ currency represents 1$ and 1 cent.)"
          example: "1.01"
          type: string
        currency:
          description: Currency code following ISO-4217
          example: USD
          type: string
      required:
      - amount
      - currency
    RoundedMonetaryAmount:
      description: "A monetary amount that must be rounded to the currency's default\
        \ decimal places (e.g., 2 decimal places for USD)."
      example:
        amount: "1.01"
        currency: USD
      properties:
        amount:
          description: "Monetary amount in decimal format, using a period (.) as the\
            \ decimal separator. Must be rounded to the currency's default decimal\
            \ places (e.g. '1.01' in USD represents 1 dollar and 1 cent)."
          example: "1.01"
          type: string
        currency:
          description: Currency code following ISO-4217
          example: USD
          type: string
      required:
      - amount
      - currency
      x-class-extra-annotation: '@io.rillet.common.infra.validators.IsRoundedAmount'
    Pagination:
      example:
        next_cursor: iLQvkEj3sh3UiweC
