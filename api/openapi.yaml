    CreateAccountRequest:
      additionalProperties: false
      example:
        metadata: ""
        code: "90909"
        intercompany: false
        subtype: Revenue
        name: My New Account
        type: ASSET
      properties:
        metadata:
          allOf:
          - $ref: '#/components/schemas/InlineMetadataValues'
          description: |
            Optional account metadata.
            MCP callers also need permission to edit accounts in addition to permission to create them.
            Invalid metadata rolls back the entire creation request.
          nullable: true
        name:
          description: Display name of the account.
          example: My New Account
          minLength: 1
          pattern: .*\S.*
          type: string
        code:
          description: "Unique account code within the organization. May contain letters,\
            \ numbers, periods, and dashes."
          example: "90909"
          minLength: 1
          pattern: "^[A-Za-z0-9.-]+$"
          type: string
        type:
          description: |
            Top-level accounting classification. Must be compatible with subtype.
            Allowed values: ASSET, LIABILITY, EQUITY, EXPENSE, INCOME.
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - EXPENSE
          - INCOME
          type: string
        subtype:
          description: |
            Accounting subtype. The following exact values are accepted and must be paired with the indicated type:

            ASSET: `Accounts Receivable`, `Fixed Assets`, `Accumulated Depreciation`, `Other Current Asset`, `Bank`,
            `Allowance for Doubtful Accounts`, `Unbilled Revenue`, `Prepaid Expense`, `Deferred Commissions`,
            `Right of Use Asset`, `Other Assets`, `Restricted Cash`.

            LIABILITY: `Other Current Liability`, `Other Long Term Liability`, `Accounts Payable`, `Credit Card`,
            `Deferred Revenue`, `Accrued Expense`, `Sales Tax Liability`, `Debt`, `Lease Liability`, `Customer Deposits`,
            `Customer Credit`.

            EQUITY: `Equity`, `Equity, Compensation`, `Additional Paid In Capital`,
            `Accumulated Other Comprehensive Income`, `Retained Earnings`.

            EXPENSE: `Cost of Goods Sold`, `Operating Expense`, `Operating Expense - Personnel`,
            `Operating Expense - Office Expenses`, `Operating Expense - Sales & Marketing`,
            `Operating Expense - Commissions`, `Operating Expense - Research & Development`,
            `Non Operating Expense`, `Non Operating Income`.

            INCOME: `Revenue`.
          enum:
          - Revenue
          - Cost of Goods Sold
          - Operating Expense
          - Equity
          - "Equity, Compensation"
          - Other Current Liability
          - Other Long Term Liability
          - Accounts Payable
          - Accounts Receivable
          - Credit Card
          - Fixed Assets
          - Accumulated Depreciation
          - Other Current Asset
          - Bank
          - Allowance for Doubtful Accounts
          - Unbilled Revenue
          - Deferred Revenue
          - Prepaid Expense
          - Deferred Commissions
          - Right of Use Asset
          - Other Assets
          - Restricted Cash
          - Accrued Expense
          - Sales Tax Liability
          - Debt
          - Lease Liability
          - Customer Deposits
          - Customer Credit
          - Additional Paid In Capital
          - Accumulated Other Comprehensive Income
          - Retained Earnings
          - Operating Expense - Personnel
          - Operating Expense - Office Expenses
          - Operating Expense - Sales & Marketing
          - Operating Expense - Commissions
          - Operating Expense - Research & Development
          - Non Operating Expense
          - Non Operating Income
          type: string
        intercompany:
          description: Whether the account is used for intercompany accounting.
          example: false
          type: boolean
      required:
      - code
      - intercompany
      - name
      - subtype
      - type
