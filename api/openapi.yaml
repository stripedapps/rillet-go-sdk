    ApprovalWorkflow:
      description: |
        An approval workflow: the conditions deciding which entries it applies to, and the ordered layers of
        approvers that must sign off.
      example:
        condition_group:
          groups:
          - null
          - null
          logic: AND
          conditions:
          - id: 0199e21b-be83-7298-a9d6-8c43437117c8
            condition_type: AMOUNT
            operator: GREATER_THAN
            threshold:
              type: MONETARY
              amount:
                amount: "50000.00"
                currency: USD
          - id: 0199e21b-be83-7298-a9d6-8c43437117c8
            condition_type: AMOUNT
            operator: GREATER_THAN
            threshold:
              type: MONETARY
              amount:
                amount: "50000.00"
                currency: USD
        updated_at: 2000-01-23T04:56:07.000+00:00
        methods:
        - IN_APP
        - IN_APP
        name: JE over 50k — Controller then CFO
        active: true
        id: 0199e21a-14c2-7abc-9d3e-112233445566
        approval_layers:
        - id: 0199e21e-3b5a-7222-9d33-bbccddeeff00
          order: 1
          approver_type: USER
          require_all: false
          approver_user_ids:
          - 0199e21a-9b3d-7cde-8f21-665544332211
        - id: 0199e21e-3b5a-7222-9d33-bbccddeeff00
          order: 1
          approver_type: USER
          require_all: false
          approver_user_ids:
          - 0199e21a-9b3d-7cde-8f21-665544332211
        type: JOURNAL_ENTRY
        priority: 1
        submission_sources: ""
      properties:
        id:
          example: 0199e21a-14c2-7abc-9d3e-112233445566
          format: uuid
          type: string
        name:
          example: JE over 50k — Controller then CFO
          type: string
        type:
          $ref: '#/components/schemas/ApprovalWorkflowType'
        active:
          description: |
            Only active workflows are evaluated. Read-only here: a workflow is activated and deactivated in
            Rillet, so this value can change without a definition update.
          type: boolean
        priority:
          description: |
            Evaluation order among the active workflows of the same type, ascending and zero-based — the first
            workflow whose conditions match is the one applied, and later ones are skipped. Assigned by the
            server: a workflow is put last when created, and again when reactivated. Not necessarily unique;
            ties are resolved by `id`.
          example: 1
          format: int32
          type: integer
        condition_group:
          $ref: '#/components/schemas/ApprovalWorkflowConditionGroup'
        approval_layers:
          description: |
            Layers of approvers in ascending `order`, each one actionable only once the previous is satisfied.
            The entry is approved when every layer is satisfied. At most five.
          items:
            $ref: '#/components/schemas/ApprovalWorkflowLayer'
          type: array
        methods:
          description: |
            How approvers are asked to act. `IN_APP` is the only method Rillet acts on today; `EMAIL` and
            `SLACK` can appear on workflows configured before they were withdrawn, and no notification is
            delivered for them.
          items:
            $ref: '#/components/schemas/ApprovalWorkflowMethod'
          type: array
        submission_sources:
          allOf:
          - $ref: '#/components/schemas/ApprovalWorkflowSubmissionSources'
          description: |
            Entry points governed by this workflow. Null or an empty list means manual entry in Rillet only.
            An explicit list applies exactly to those sources. Provider import, scheduled sync, and reimport
            are the runtime sources represented as Connected integrations in Rillet.
          nullable: true
        updated_at:
          description: |
            ISO 8601 timestamp in UTC timezone (must end with 'Z'). Covers activation and reordering as well as
            definition changes.
          format: date-time
          type: string
      required:
      - active
      - approval_layers
      - condition_group
      - id
      - methods
      - name
      - priority
      - type
      - updated_at
    ApprovalWorkflowRequest:
      description: |
        An approval workflow's definition, as sent when creating or replacing one. A workflow's `type` never
        changes, and `active` changes only through activation in Rillet, so an update must send both back
        unchanged.
      example:
        condition_group:
          groups:
          - null
          - null
          logic: AND
          conditions:
          - condition_type: AMOUNT
            operator: GREATER_THAN
            threshold:
              type: MONETARY
              amount:
                amount: "50000.00"
                currency: USD
          - condition_type: AMOUNT
            operator: GREATER_THAN
            threshold:
              type: MONETARY
              amount:
                amount: "50000.00"
                currency: USD
        methods:
        - IN_APP
        - IN_APP
        name: JE over 50k — Controller then CFO
        active: true
        approval_layers:
        - order: 1
          approver_type: USER
          require_all: false
          approver_user_ids:
          - 0199e21a-9b3d-7cde-8f21-665544332211
        - order: 1
          approver_type: USER
          require_all: false
          approver_user_ids:
          - 0199e21a-9b3d-7cde-8f21-665544332211
        - order: 1
          approver_type: USER
          require_all: false
