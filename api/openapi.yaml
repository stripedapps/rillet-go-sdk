            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Gets custom fields
      tags:
      - Fields
    post:
      description: |
        Defines a new custom field (text, number, pick list, etc.) that can be attached to supported Rillet entities for reporting and automation.
        After creation, use create-field-value to seed allowed pick-list entries or default values teams should see in the UI.
      operationId: create-field
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
