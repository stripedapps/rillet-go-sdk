                $ref: '#/components/schemas/Field'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a field
      tags:
      - Fields
  /fields/{id}:
    parameters:
    - description: UUID of the id to be used in this operation.
      explode: false
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    put:
      description: |
        Changes labels, validation rules, or visibility metadata on an existing custom field without recreating historical values.
        Coordinate with stakeholders before renaming because downstream integrations often key off the human-readable label.
      operationId: update-field
      parameters:
      - description: UUID of the id to be used in this operation.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates a field
      tags:
      - Fields
  /fields/{id}/values:
    parameters:
    - description: UUID of the id to be used in this operation.
      explode: false
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    post:
      description: |
        Adds a selectable value to a pick-list style custom field so users and APIs can tag entities with consistent taxonomy.
        Values inherit the field’s scope, so create them after the parent field exists and before importing records that reference the new code.
      operationId: create-field-value
      parameters:
      - description: UUID of the id to be used in this operation.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldValueRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Creates a field value
      tags:
      - Fields
  /fields/{fieldId}/values/{fieldValueId}:
    delete:
      description: |
        Retires a pick-list option that should no longer be selectable while keeping older records intact for read-only history.
        Confirm no automation or validation rules still require the value before removal to avoid breaking bulk imports.
      operationId: delete-field-value
      parameters:
      - description: UUID of the field to be used in this operation.
        explode: false
        in: path
        name: fieldId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: UUID of the fieldValue to be used in this operation.
        explode: false
        in: path
        name: fieldValueId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Deletes a field value
      tags:
      - Fields
    parameters:
    - description: UUID of the field to be used in this operation.
      explode: false
      in: path
      name: fieldId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    - description: UUID of the fieldValue to be used in this operation.
      explode: false
      in: path
      name: fieldValueId
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    put:
      description: |
        Renames or reorders a pick-list entry while preserving its underlying id so historical records stay linked to the same option.
        Prefer this over delete-and-recreate when auditing requires stable references across reporting periods.
      operationId: update-field-value
      parameters:
      - description: UUID of the field to be used in this operation.
        explode: false
        in: path
        name: fieldId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: UUID of the fieldValue to be used in this operation.
        explode: false
        in: path
        name: fieldValueId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldValueRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      summary: Updates a field value
      tags:
      - Fields
