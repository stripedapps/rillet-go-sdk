      - $ref: '#/components/schemas/ApprovalWorkflowApiSubmittedCondition'
      - $ref: '#/components/schemas/ApprovalWorkflowMcpSubmittedCondition'
      - $ref: '#/components/schemas/ApprovalWorkflowFieldCondition'
      - $ref: '#/components/schemas/ApprovalWorkflowAccountCondition'
      - $ref: '#/components/schemas/ApprovalWorkflowSourceTypeCondition'
      - $ref: '#/components/schemas/ApprovalWorkflowVendorCondition'
      - $ref: '#/components/schemas/ApprovalWorkflowCustomerCondition'
