        in: query
        name: book_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: Filter journal entries updated after this timestamp
        explode: true
        in: query
        name: updated.gt
        required: false
        schema:
          example: 2023-01-01T00:00:00Z
          format: date-time
          type: string
        style: form
      - description: Filter journal entries with a posting date on or after this date
          (inclusive)
        explode: true
        in: query
        name: date.gte
        required: false
        schema:
          example: 2023-12-01
          format: date
          type: string
        style: form
      - description: Filter journal entries with a posting date on or before this
          date (inclusive)
        explode: true
        in: query
        name: date.lte
        required: false
        schema:
          example: 2023-12-31
          format: date
          type: string
        style: form
      - description: Filter journal entries that have at least one line item posting
          to any of these account ids (comma-separated)
        example:
        - 11111111-1111-1111-1111-111111111111
        - 22222222-2222-2222-2222-222222222222
        explode: false
        in: query
        name: account_ids
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
        style: form
      - description: the field the journal entries should be sorted by descending
          (either created or updated)
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: created
          enum:
          - created
          - updated
          type: string
        style: form
      responses:
        "200":
          content:
